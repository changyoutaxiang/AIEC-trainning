<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>习惯1完整性修复测试</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; margin: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        .unit { margin: 30px 0; padding: 20px; border: 1px solid #ddd; border-radius: 8px; }
        .practice { margin: 15px 0; padding: 15px; background: #f8f9fa; border-radius: 6px; }
        .practice-id { color: #007bff; font-weight: bold; }
        .practice-title { font-size: 16px; font-weight: bold; margin: 8px 0; }
        .practice-scenario { margin: 8px 0; color: #666; font-size: 14px; }
        .practice-task { margin: 8px 0; font-weight: 500; font-size: 14px; }
        .dimensions { margin: 10px 0; }
        .dimension { display: inline-block; margin: 3px 5px; padding: 3px 8px; 
                     background: #e3f2fd; color: #1976d2; border-radius: 12px; font-size: 12px; }
        .summary { background: #e8f5e8; padding: 15px; border-radius: 8px; margin: 20px 0; }
        .comparison { background: #fff3cd; padding: 15px; border-radius: 8px; margin: 20px 0; }
        .error { background: #ffe6e6; color: #d63384; padding: 10px; border-radius: 6px; }
        .unit-title { color: #2e7d32; font-size: 20px; font-weight: bold; }
        .unit-subtitle { color: #666; font-style: italic; margin: 5px 0; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔧 习惯1：积极主动 - 完整性修复验证</h1>
        
        <div class="comparison">
            <h3>修复前后对比</h3>
            <table style="width: 100%; border-collapse: collapse;">
                <tr style="background: #f8f9fa;">
                    <th style="padding: 10px; border: 1px solid #ddd;">项目</th>
                    <th style="padding: 10px; border: 1px solid #ddd;">修复前</th>
                    <th style="padding: 10px; border: 1px solid #ddd;">修复后</th>
                    <th style="padding: 10px; border: 1px solid #ddd;">标准</th>
                </tr>
                <tr>
                    <td style="padding: 10px; border: 1px solid #ddd;">单元数量</td>
                    <td style="padding: 10px; border: 1px solid #ddd; color: #d63384;">2个</td>
                    <td style="padding: 10px; border: 1px solid #ddd; color: #2e7d32;">4个</td>
                    <td style="padding: 10px; border: 1px solid #ddd;">4个</td>
                </tr>
                <tr>
                    <td style="padding: 10px; border: 1px solid #ddd;">练习总数</td>
                    <td style="padding: 10px; border: 1px solid #ddd; color: #d63384;">2个</td>
                    <td style="padding: 10px; border: 1px solid #ddd; color: #2e7d32;">12个</td>
                    <td style="padding: 10px; border: 1px solid #ddd;">12个</td>
                </tr>
            </table>
        </div>

        <div id="loading">正在加载习惯1数据...</div>
        <div id="content" style="display: none;"></div>
        <div id="error" style="display: none;"></div>
    </div>

    <script>
        async function loadHabit1Data() {
            try {
                const response = await fetch('/content/seven_habits.json?v=' + Date.now());
                const data = await response.json();
                const habit1 = data.habits.habit_1;
                
                let html = '';
                let totalPractices = 0;
                let totalUnits = 0;
                
                Object.entries(habit1.units).forEach(([unitId, unit]) => {
                    totalUnits++;
                    html += `<div class="unit">`;
                    html += `<div class="unit-title">${unit.unitName}</div>`;
                    html += `<div class="unit-subtitle">${unit.subtitle}</div>`;
                    html += `<p><strong>单元ID:</strong> ${unitId}</p>`;
                    html += `<p><strong>描述:</strong> ${unit.description}</p>`;
                    
                    if (unit.sections && unit.sections.practice_arena) {
                        const practices = unit.sections.practice_arena;
                        html += `<h4>实战练习 (${practices.length}个)</h4>`;
                        totalPractices += practices.length;
                        
                        practices.forEach((practice, index) => {
                            html += `<div class="practice">`;
                            html += `<div class="practice-id">${practice.practiceId}</div>`;
                            html += `<div class="practice-title">${practice.title}</div>`;
                            html += `<div class="practice-scenario"><strong>场景:</strong> ${practice.scenario.substring(0, 100)}...</div>`;
                            html += `<div class="practice-task"><strong>任务:</strong> ${practice.task}</div>`;
                            html += `<div class="dimensions">`;
                            practice.evaluationDimensions.forEach(dim => {
                                html += `<span class="dimension">${dim}</span>`;
                            });
                            html += `</div>`;
                            html += `</div>`;
                        });
                    } else {
                        html += `<div class="error">❌ 该单元缺少练习数据</div>`;
                    }
                    
                    html += `</div>`;
                });
                
                // 添加验证结果总结
                const isUnitsComplete = totalUnits === 4;
                const isPracticesComplete = totalPractices === 12;
                const isFullyComplete = isUnitsComplete && isPracticesComplete;
                
                html = `<div class="summary">
                    <h3>${isFullyComplete ? '✅ 修复验证成功' : '❌ 修复验证失败'}</h3>
                    <p><strong>单元数量:</strong> ${totalUnits}/4 ${isUnitsComplete ? '✅' : '❌'}</p>
                    <p><strong>练习数量:</strong> ${totalPractices}/12 ${isPracticesComplete ? '✅' : '❌'}</p>
                    <p><strong>数据完整性:</strong> ${isFullyComplete ? '完整' : '不完整'}</p>
                    <p><strong>修复状态:</strong> ${isFullyComplete ? '成功' : '需要进一步修复'}</p>
                </div>` + html;
                
                document.getElementById('content').innerHTML = html;
                document.getElementById('content').style.display = 'block';
                document.getElementById('loading').style.display = 'none';
                
            } catch (error) {
                document.getElementById('error').innerHTML = `
                    <div class="error">
                        <h3>❌ 加载失败</h3>
                        <p>错误信息: ${error.message}</p>
                        <p>请确保前端服务器正在运行: http://localhost:8080</p>
                    </div>
                `;
                document.getElementById('error').style.display = 'block';
                document.getElementById('loading').style.display = 'none';
            }
        }
        
        // 页面加载时执行
        window.addEventListener('load', loadHabit1Data);
    </script>
</body>
</html>
