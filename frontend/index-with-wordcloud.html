<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIEC 职场软技能</title>
    <link rel="stylesheet" href="css/style.css?v=2">
</head>
<body>
    <div class="homepage-container">
        <header class="header">
            <nav class="nav">
                <div class="logo">AIEC 职场软技能</div>
                <div class="nav-links">
                    <a href="index.html">首页</a>
                    <a href="seven-habits.html">七个习惯</a>
                    <a href="my-journey.html">我的旅程</a>
                    <a href="skills.html">技能训练</a>
                    <a href="#" onclick="logout()">退出</a>
                </div>
            </nav>
        </header>

        <!-- Hero区域 - 词云图片 -->
        <section class="hero-section">
            <div class="hero-content">
                <div class="hero-image-container">
                    <img src="assets/wordcloud-hero.png" alt="AI技能发展词云图" class="hero-wordcloud" />
                </div>
                <div class="hero-buttons">
                    <button class="btn btn-primary btn-large" onclick="window.location.href='seven-habits.html'">立即开始学习</button>
                    <button class="btn btn-secondary btn-large" onclick="scrollToLearningMethods()">了解更多</button>
                </div>
            </div>
        </section>

        <!-- 学习方式介绍区域 -->
        <section class="learning-methods-section" id="learning-methods">
            <div class="section-container">
                <h2 class="section-title">学习方式</h2>
                <p class="section-subtitle">四种互补的学习方式，构建完整的能力培养体系</p>
                <div class="learning-methods-grid">
                    <div class="method-card">
                        <div class="method-icon">🎓</div>
                        <h3 class="method-title">理论导入</h3>
                        <p class="method-description">深入理解核心理念和原理，建立扎实的理论基础</p>
                    </div>
                    <div class="method-card">
                        <div class="method-icon">👨‍🏫</div>
                        <h3 class="method-title">导师采撷</h3>
                        <p class="method-description">学习专家导师的实践经验和深度洞察</p>
                    </div>
                    <div class="method-card">
                        <div class="method-icon">🎯</div>
                        <h3 class="method-title">场景练习</h3>
                        <p class="method-description">在真实职场场景中练习和应用所学技能</p>
                    </div>
                    <div class="method-card">
                        <div class="method-icon">🧩</div>
                        <h3 class="method-title">应用难题</h3>
                        <p class="method-description">解决复杂的实际问题，深化理解和应用</p>
                    </div>
                </div>
            </div>
        </section>

        <!-- 核心功能导航区域 -->
        <section class="core-features-section">
            <div class="section-container">
                <h2 class="section-title">核心功能</h2>
                <p class="section-subtitle">选择适合你的学习路径，开始成长之旅</p>
                <div class="features-grid">
                    <div class="feature-card feature-available">
                        <div class="feature-icon">💎</div>
                        <h3 class="feature-title">七个习惯</h3>
                        <p class="feature-description">完整的个人效能和团队协作体系，7个习惯21个训练单元</p>
                        <div class="feature-status">
                            <span class="status-badge status-ready">完整体系</span>
                        </div>
                        <button class="btn btn-primary btn-large" onclick="window.location.href='seven-habits.html'">进入学习</button>
                    </div>
                    <div class="feature-card feature-coming">
                        <div class="feature-icon">🎯</div>
                        <h3 class="feature-title">技能训练</h3>
                        <p class="feature-description">针对具体职场技能的专项训练，包括沟通、谈判、领导力等</p>
                        <div class="feature-status">
                            <span class="status-badge status-coming">敬请期待</span>
                        </div>
                        <button class="btn btn-secondary btn-large" disabled>即将推出</button>
                    </div>
                </div>
            </div>
        </section>

    </div>

    <script src="js/utils.js"></script>
    <script src="js/app.js"></script>
    <script>
        // 首页专用JavaScript函数
        function scrollToLearningMethods() {
            const element = document.getElementById('learning-methods');
            if (element) {
                element.scrollIntoView({ 
                    behavior: 'smooth',
                    block: 'start'
                });
            }
        }
    </script>
</body>
</html>
