<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI回复显示修复测试 - AIEC</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            margin: 20px; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-height: 100vh;
        }
        .container { 
            max-width: 800px; 
            margin: 0 auto; 
            background: rgba(255,255,255,0.1); 
            padding: 30px; 
            border-radius: 20px; 
            backdrop-filter: blur(10px);
        }
        .title {
            font-size: 2.5em;
            margin-bottom: 20px;
            text-align: center;
            font-weight: 300;
        }
        .test-button { 
            background: rgba(255,255,255,0.2); 
            color: white; 
            border: 2px solid rgba(255,255,255,0.3);
            padding: 15px 30px; 
            border-radius: 50px; 
            cursor: pointer; 
            margin: 10px; 
            font-size: 16px;
            font-weight: 500;
            transition: all 0.3s ease;
        }
        .test-button:hover { 
            background: rgba(255,255,255,0.3); 
            transform: translateY(-2px);
        }
        .test-button:disabled { 
            background: rgba(255,255,255,0.1); 
            cursor: not-allowed; 
            opacity: 0.5;
        }
        .status { 
            padding: 20px; 
            margin: 20px 0; 
            border-radius: 15px; 
            backdrop-filter: blur(10px);
        }
        .success { background: rgba(76, 175, 80, 0.3); border: 2px solid rgba(76, 175, 80, 0.5); }
        .error { background: rgba(244, 67, 54, 0.3); border: 2px solid rgba(244, 67, 54, 0.5); }
        .info { background: rgba(33, 150, 243, 0.3); border: 2px solid rgba(33, 150, 243, 0.5); }
        .loading { background: rgba(255, 193, 7, 0.3); border: 2px solid rgba(255, 193, 7, 0.5); }
        .debug-output {
            background: rgba(0,0,0,0.7);
            color: #00ff00;
            padding: 20px;
            border-radius: 10px;
            font-family: Monaco, monospace;
            font-size: 14px;
            white-space: pre-wrap;
            max-height: 400px;
            overflow-y: auto;
            margin: 20px 0;
            border: 2px solid rgba(0,255,0,0.3);
        }
        .conversation-display {
            background: rgba(255,255,255,0.1);
            padding: 20px;
            border-radius: 15px;
            margin: 20px 0;
            border: 2px solid rgba(255,255,255,0.2);
        }
        .message {
            margin: 15px 0;
            padding: 15px;
            border-radius: 10px;
        }
        .user-message {
            background: rgba(33, 150, 243, 0.3);
            margin-left: 20px;
        }
        .ai-message {
            background: rgba(156, 39, 176, 0.3);
            margin-right: 20px;
        }
        .go-live-btn {
            background: rgba(76, 175, 80, 0.4);
            border-color: rgba(76, 175, 80, 0.6);
            font-size: 18px;
            padding: 20px 40px;
        }
        .go-live-btn:hover {
            background: rgba(76, 175, 80, 0.6);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="title">🎯 AI回复显示修复测试</h1>
        <p style="text-align: center; font-size: 1.2em; margin-bottom: 30px;">验证AI回复能否正确显示在页面上</p>
        
        <div id="status-display" class="status info">
            <strong>🔍 状态:</strong> 准备测试AI回复显示修复...
        </div>
        
        <div style="text-align: center; margin: 20px 0;">
            <button class="test-button" onclick="testDisplayFix()" id="testBtn">🚀 测试显示修复</button>
            <button class="test-button" onclick="clearResults()">🗑️ 清空结果</button>
        </div>
        
        <div class="debug-output" id="debug-output">等待测试结果...</div>
        
        <div id="conversation-container"></div>
        
        <div style="text-align: center; margin: 30px 0;">
            <a href="#" class="test-button go-live-btn" id="goLiveBtn" style="display: none;">🎊 前往实际页面测试</a>
        </div>
    </div>

    <!-- 加载最新版本的脚本 -->
    <script src="js/utils.js?v=1"></script>
    <script src="js/app.js?v=10"></script>
    <script src="js/aiService.js?v=4"></script>
    
    <script>
        let debugMessages = [];
        
        function addDebug(message) {
            const timestamp = new Date().toLocaleTimeString();
            debugMessages.push(`[${timestamp}] ${message}`);
            document.getElementById('debug-output').textContent = debugMessages.join('\n');
            document.getElementById('debug-output').scrollTop = document.getElementById('debug-output').scrollHeight;
        }
        
        function updateStatus(type, message) {
            const statusEl = document.getElementById('status-display');
            statusEl.className = `status ${type}`;
            statusEl.innerHTML = `<strong>${type === 'success' ? '✅' : type === 'error' ? '❌' : type === 'loading' ? '⏳' : '🔍'} 状态:</strong> ${message}`;
        }
        
        function clearResults() {
            debugMessages = [];
            document.getElementById('debug-output').textContent = '结果已清空...';
            document.getElementById('conversation-container').innerHTML = '';
            document.getElementById('goLiveBtn').style.display = 'none';
            updateStatus('info', '结果已清空，准备重新测试');
        }
        
        async function testDisplayFix() {
            const btn = document.getElementById('testBtn');
            btn.disabled = true;
            updateStatus('loading', '正在测试AI回复显示修复...');
            
            try {
                addDebug('🚀 开始AI回复显示修复测试');
                
                // 创建测试难题数据
                const testDilemma = {
                    dilemmaId: 'display_test',
                    title: '显示修复测试',
                    question: '这是一个测试AI回复显示的问题',
                    coachingLogic: '测试引导逻辑'
                };
                
                const testThought = '这是用户的测试想法，用来验证AI回复是否能正确显示';
                
                addDebug('📝 测试数据准备完成');
                addDebug(`📝 难题: ${testDilemma.title}`);
                addDebug(`📝 用户想法: ${testThought}`);
                
                // 创建DilemmaManager实例并调用方法
                const dilemmaManager = new DilemmaManager();
                addDebug('✅ DilemmaManager 实例创建成功');
                
                addDebug('🔄 正在调用AI服务...');
                const rawResult = await dilemmaManager.guideDilemmaDiscussion(
                    testDilemma, 
                    testThought, 
                    []
                );
                
                addDebug('✅ AI服务调用成功');
                addDebug(`📊 原始返回数据类型: ${typeof rawResult}`);
                addDebug(`📊 原始返回数据: ${JSON.stringify(rawResult, null, 2)}`);
                
                // 模拟数据处理逻辑（与habit-learning.js中的逻辑相同）
                let aiContent = '';
                if (typeof rawResult === 'string') {
                    aiContent = rawResult;
                } else if (rawResult && rawResult.guidance) {
                    aiContent = rawResult.guidance;
                } else if (rawResult && rawResult.data && rawResult.data.guidance) {
                    aiContent = rawResult.data.guidance;
                } else {
                    aiContent = rawResult || '抱歉，我没有收到有效的回复';
                }
                
                addDebug(`📄 处理后的AI内容: ${aiContent}`);
                
                // 模拟对话历史
                const conversationHistory = [
                    {
                        role: 'user',
                        content: testThought,
                        timestamp: new Date().toISOString()
                    },
                    {
                        role: 'ai',
                        content: aiContent,
                        timestamp: new Date().toISOString()
                    }
                ];
                
                // 显示对话
                displayConversation(conversationHistory);
                
                updateStatus('success', '🎉 AI回复显示修复测试成功！');
                addDebug('🎊 显示修复测试完成 - 成功');
                
                // 显示前往实际页面的按钮
                const goLiveBtn = document.getElementById('goLiveBtn');
                goLiveBtn.style.display = 'inline-block';
                goLiveBtn.href = `habit-learning.html?habit=1&_display_fixed=${Date.now()}`;
                
            } catch (error) {
                updateStatus('error', `❌ 显示修复测试失败: ${error.message}`);
                addDebug(`❌ 测试失败: ${error.message}`);
                addDebug(`❌ 错误堆栈: ${error.stack}`);
            }
            
            btn.disabled = false;
        }
        
        function displayConversation(conversationHistory) {
            const container = document.getElementById('conversation-container');
            const conversationHtml = `
                <div class="conversation-display">
                    <h3 style="text-align: center; margin-bottom: 20px;">💬 模拟对话显示</h3>
                    ${conversationHistory.map(msg => `
                        <div class="message ${msg.role === 'user' ? 'user-message' : 'ai-message'}">
                            <strong>${msg.role === 'user' ? '👤 用户' : '🤖 AI导师'}:</strong>
                            <p style="margin: 10px 0 5px 0;">${msg.content}</p>
                            <small style="opacity: 0.7; font-size: 0.8em;">${new Date(msg.timestamp).toLocaleTimeString()}</small>
                        </div>
                    `).join('')}
                    <div style="text-align: center; margin-top: 20px; padding: 15px; background: rgba(76, 175, 80, 0.2); border-radius: 10px;">
                        <strong>✨ 显示修复成功！</strong><br>
                        <span style="font-size: 0.9em; opacity: 0.9;">AI回复现在能够正确显示在页面上了</span>
                    </div>
                </div>
            `;
            container.innerHTML = conversationHtml;
        }
        
        // 页面加载完成后显示信息
        window.addEventListener('load', function() {
            addDebug('📄 AI回复显示修复测试页面加载完成');
            addDebug('🔧 修复内容: 增强了AI回复数据结构的处理逻辑');
            addDebug('🔧 脚本版本: habit-learning.js?v=13');
            
            setTimeout(() => {
                addDebug('⚡ 自动运行显示修复测试...');
                testDisplayFix();
            }, 1000);
        });
    </script>
</body>
</html>
