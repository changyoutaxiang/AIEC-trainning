<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIEC 职场软技能 - 登录</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="login-container">
        <!-- 左侧：品牌信息区域 -->
        <div class="login-brand">
            <h1>AIEC 职场软技能</h1>
            <p>提升职场竞争力，掌握七个高效能习惯，成为更好的自己。</p>
            <div class="auth-buttons">
                <button id="loginBtn" class="btn btn-primary">登录</button>
                <button id="registerBtn" class="btn btn-secondary">注册</button>
            </div>
        </div>
        
        <!-- 右侧：登录表单区域 -->
        <div class="login-form-container">
            <div class="login-form">
                <h2>欢迎回来</h2>
                <form id="loginForm">
                    <div class="form-group">
                        <label for="username">用户名</label>
                        <input type="text" id="username" name="username" required>
                    </div>
                    <div class="form-group">
                        <label for="password">密码</label>
                        <input type="password" id="password" name="password" required>
                    </div>
                    <button type="submit" class="btn btn-primary btn-full">登录</button>
                </form>
                <p class="register-link">还没有账户？<a href="#" id="showRegister">立即注册</a></p>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
</body>
</html>
