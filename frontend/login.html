<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIEC 职场软技能 - 登录</title>
    <link rel="stylesheet" href="css/style.css?v=2">
</head>
<body class="login-page">
    <div class="login-container">
        <!-- 左侧：品牌信息区域 -->
        <div class="login-brand">
            <h1>AIEC 职场软技能</h1>
            <p>提升职场竞争力，掌握七个高效能习惯，成为更好的自己。</p>
            <div class="auth-buttons">
                <button id="loginBtn" class="btn btn-primary">登录</button>
                <button id="registerBtn" class="btn btn-secondary">注册</button>
            </div>
        </div>
        
        <!-- 右侧：登录表单区域 -->
        <div class="login-form-container">
            <div class="login-form">
                <h2>企业邮箱登录</h2>
                <p class="auth-subtitle">使用您的企业邮箱地址登录AIEC学习系统</p>
                <form id="loginForm">
                    <div class="form-group">
                        <label for="email">企业邮箱</label>
                        <input type="email" id="email" name="email" placeholder="your.name@company.com" required>
                        <small class="form-hint">请使用已授权的企业邮箱地址</small>
                    </div>
                    <div class="form-group">
                        <label for="password">6位数字密码</label>
                        <input type="password" id="password" name="password" placeholder="请输入6位数字密码" maxlength="6" pattern="[0-9]{6}" required>
                        <small class="form-hint">请输入注册时设置的6位数字密码</small>
                    </div>
                    <button type="submit" class="btn btn-primary btn-full">登录</button>
                </form>
                <p class="register-link">首次使用？<a href="register.html" id="showRegister">立即注册</a></p>
                <p class="auth-note">📧 只有授权的企业邮箱才能注册和登录</p>
            </div>
        </div>
    </div>

    <script src="js/utils.js"></script>
    <script src="js/enterprise-auth.js"></script>
</body>
</html>
