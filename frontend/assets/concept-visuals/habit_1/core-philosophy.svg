<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#007AFF;stop-opacity:0.1"/>
      <stop offset="100%" style="stop-color:#007AFF;stop-opacity:0.05"/>
    </linearGradient>
    <linearGradient id="circleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#007AFF;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#0056CC;stop-opacity:0.9"/>
    </linearGradient>
  </defs>
  
  <!-- 背景 -->
  <rect width="400" height="300" fill="url(#bgGradient)" rx="12"/>
  
  <!-- 外部刺激 (左侧箭头) -->
  <g transform="translate(50,150)">
    <path d="M0,0 L30,0 L25,-8 M30,0 L25,8" stroke="#333" stroke-width="2" fill="none"/>
    <text x="-10" y="-15" font-family="system-ui" font-size="12" fill="#666" text-anchor="middle">刺激</text>
  </g>
  
  <!-- 中心空间 (核心概念) -->
  <circle cx="200" cy="150" r="60" fill="url(#circleGradient)" stroke="#007AFF" stroke-width="2"/>
  <text x="200" y="140" font-family="system-ui" font-size="14" font-weight="600" fill="white" text-anchor="middle">选择的</text>
  <text x="200" y="158" font-family="system-ui" font-size="14" font-weight="600" fill="white" text-anchor="middle">空间</text>
  
  <!-- 回应 (右侧箭头) -->
  <g transform="translate(320,150)">
    <path d="M0,0 L30,0 L25,-8 M30,0 L25,8" stroke="#333" stroke-width="2" fill="none"/>
    <text x="40" y="-15" font-family="system-ui" font-size="12" fill="#666" text-anchor="middle">回应</text>
  </g>
  
  <!-- 装饰性元素 -->
  <circle cx="120" cy="80" r="3" fill="#007AFF" opacity="0.4"/>
  <circle cx="280" cy="220" r="3" fill="#007AFF" opacity="0.4"/>
  <circle cx="150" cy="250" r="2" fill="#0056CC" opacity="0.3"/>
  <circle cx="250" cy="50" r="2" fill="#0056CC" opacity="0.3"/>
  
  <!-- 底部说明文字 -->
  <text x="200" y="280" font-family="system-ui" font-size="11" fill="#666" text-anchor="middle" opacity="0.8">
    在刺激与回应之间，我们拥有选择的自由
  </text>
</svg>