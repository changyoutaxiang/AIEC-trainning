<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="waveGradient1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF9500;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#FFD60A;stop-opacity:0.8"/>
    </linearGradient>
    <linearGradient id="waveGradient2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#007AFF;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#34C759;stop-opacity:0.6"/>
    </linearGradient>
    <linearGradient id="centerGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#007AFF;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#0056CC;stop-opacity:0.9"/>
    </linearGradient>
  </defs>
  
  <!-- 背景变化波浪 -->
  <g opacity="0.6">
    <!-- 第一层变化波 -->
    <path d="M0,180 Q100,160 200,180 T400,180 L400,200 Q300,220 200,200 T0,200 Z" 
          fill="url(#waveGradient1)"/>
    <!-- 第二层变化波 -->
    <path d="M0,120 Q150,100 300,120 Q350,125 400,130 L400,150 Q350,155 300,150 Q150,130 0,150 Z" 
          fill="url(#waveGradient2)"/>
    <!-- 第三层变化波 -->
    <path d="M0,80 Q200,60 400,80 L400,100 Q200,120 0,100 Z" 
          fill="url(#waveGradient1)" opacity="0.4"/>
  </g>
  
  <!-- 中心选择点 -->
  <circle cx="200" cy="150" r="35" fill="url(#centerGradient)" stroke="white" stroke-width="3"/>
  <circle cx="200" cy="150" r="20" fill="white" opacity="0.9"/>
  <text x="200" y="145" font-family="system-ui" font-size="10" font-weight="600" fill="#007AFF" text-anchor="middle">主动</text>
  <text x="200" y="158" font-family="system-ui" font-size="10" font-weight="600" fill="#007AFF" text-anchor="middle">选择</text>
  
  <!-- 多条路径选择 -->
  <g stroke="#007AFF" stroke-width="3" fill="none" opacity="0.8">
    <!-- 向上路径 -->
    <path d="M200,115 Q200,90 180,70 M200,115 Q200,90 220,70"/>
    <path d="M175,75 L180,70 L185,75 M215,75 L220,70 L225,75"/>
    
    <!-- 向左路径 -->
    <path d="M165,150 Q140,150 120,130 M165,150 Q140,150 120,170"/>
    <path d="M125,125 L120,130 L125,135 M125,165 L120,170 L125,175"/>
    
    <!-- 向右路径 -->
    <path d="M235,150 Q260,150 280,130 M235,150 Q260,150 280,170"/>
    <path d="M275,125 L280,130 L285,135 M275,165 L280,170 L285,175"/>
    
    <!-- 向下路径 -->
    <path d="M200,185 Q200,210 180,230 M200,185 Q200,210 220,230"/>
    <path d="M175,225 L180,230 L185,235 M215,225 L220,230 L225,235"/>
  </g>
  
  <!-- 变化指示符 -->
  <g transform="translate(150,100)" opacity="0.7">
    <text x="0" y="0" font-family="system-ui" font-size="10" fill="#FF9500" text-anchor="middle">变化</text>
    <circle cx="0" cy="8" r="2" fill="#FF9500"/>
    <circle cx="-8" cy="8" r="1.5" fill="#FF9500" opacity="0.7"/>
    <circle cx="8" cy="8" r="1.5" fill="#FF9500" opacity="0.7"/>
  </g>
  
  <g transform="translate(250,100)" opacity="0.7">
    <text x="0" y="0" font-family="system-ui" font-size="10" fill="#34C759" text-anchor="middle">机遇</text>
    <circle cx="0" cy="8" r="2" fill="#34C759"/>
    <circle cx="-8" cy="8" r="1.5" fill="#34C759" opacity="0.7"/>
    <circle cx="8" cy="8" r="1.5" fill="#34C759" opacity="0.7"/>
  </g>
  
  <!-- 适应性元素 -->
  <g transform="translate(120,200)" opacity="0.6">
    <!-- 柔韧的曲线 -->
    <path d="M0,0 Q20,-10 40,0 Q60,10 80,0" stroke="#FFD60A" stroke-width="2" fill="none"/>
    <text x="40" y="-15" font-family="system-ui" font-size="9" fill="#FF9500" text-anchor="middle">适应性</text>
  </g>
  
  <g transform="translate(200,200)" opacity="0.6">
    <!-- 灵活的分支 -->
    <path d="M0,0 L-15,-15 M0,0 L0,-20 M0,0 L15,-15" stroke="#34C759" stroke-width="2"/>
    <text x="0" y="15" font-family="system-ui" font-size="9" fill="#34C759" text-anchor="middle">灵活性</text>
  </g>
  
  <!-- 决策能量环 -->
  <g transform="translate(200,150)">
    <circle cx="0" cy="0" r="45" stroke="#007AFF" stroke-width="1" fill="none" opacity="0.3" 
            stroke-dasharray="3,3">
      <animateTransform attributeName="transform" type="rotate" 
                        values="0;360" dur="20s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- 底部标题 -->
  <text x="200" y="270" font-family="system-ui" font-size="14" font-weight="600" fill="#1C1C1E" text-anchor="middle">
    拥抱不确定性 (Embracing Uncertainty)
  </text>
  <text x="200" y="285" font-family="system-ui" font-size="11" fill="#666" text-anchor="middle" opacity="0.8">
    在变化中主动选择
  </text>
</svg>