<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="shieldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#34C759;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#30D158;stop-opacity:0.9"/>
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#007AFF;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#007AFF;stop-opacity:0"/>
    </radialGradient>
  </defs>
  
  <!-- 背景光晕 -->
  <circle cx="200" cy="150" r="120" fill="url(#centerGlow)"/>
  
  <!-- 盾牌形状象征责任感 -->
  <path d="M200,60 Q240,60 260,90 L260,160 Q260,200 200,220 Q140,200 140,160 L140,90 Q160,60 200,60 Z" 
        fill="url(#shieldGradient)" stroke="#28A745" stroke-width="2"/>
  
  <!-- 中心圆形 -->
  <circle cx="200" cy="140" r="30" fill="white" stroke="#007AFF" stroke-width="2"/>
  
  <!-- 中心文字 -->
  <text x="200" y="135" font-family="system-ui" font-size="12" font-weight="600" fill="#007AFF" text-anchor="middle">问题</text>
  <text x="200" y="150" font-family="system-ui" font-size="12" font-weight="600" fill="#007AFF" text-anchor="middle">到我</text>
  
  <!-- 四个方向的箭头指向中心 -->
  <g stroke="#666" stroke-width="2" fill="none">
    <!-- 上 -->
    <path d="M200,40 L200,60 M195,45 L200,40 L205,45"/>
    <!-- 下 -->
    <path d="M200,240 L200,220 M195,235 L200,240 L205,235"/>
    <!-- 左 -->
    <path d="M120,140 L140,140 M125,135 L120,140 L125,145"/>
    <!-- 右 -->
    <path d="M280,140 L260,140 M275,135 L280,140 L275,145"/>
  </g>
  
  <!-- 装饰性星形 -->
  <g transform="translate(150,100)" fill="#FFD60A" opacity="0.6">
    <path d="M0,-8 L2,-2 L8,0 L2,2 L0,8 L-2,2 L-8,0 L-2,-2 Z"/>
  </g>
  <g transform="translate(250,180)" fill="#FFD60A" opacity="0.6">
    <path d="M0,-6 L1.5,-1.5 L6,0 L1.5,1.5 L0,6 L-1.5,1.5 L-6,0 L-1.5,-1.5 Z"/>
  </g>
  
  <!-- 底部标题 -->
  <text x="200" y="270" font-family="system-ui" font-size="14" font-weight="600" fill="#1C1C1E" text-anchor="middle">
    责任感 (Ownership)
  </text>
  <text x="200" y="285" font-family="system-ui" font-size="11" fill="#666" text-anchor="middle" opacity="0.8">
    承担100%的责任
  </text>
</svg>