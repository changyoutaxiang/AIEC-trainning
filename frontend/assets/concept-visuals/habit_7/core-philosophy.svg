<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="systemGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="upgradeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f093fb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5576c;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="renewalGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00f2fe;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- 背景 -->
  <rect width="400" height="300" fill="#f8fafc"/>
  
  <!-- 标题 -->
  <text x="200" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2d3748">
    不断更新：高性能系统的三维升级
  </text>
  
  <!-- 中央高性能系统 -->
  <g transform="translate(200, 150)">
    <!-- 主系统外壳 -->
    <rect x="-60" y="-40" width="120" height="80" fill="url(#systemGradient)" rx="15" filter="url(#glow)" opacity="0.9"/>
    
    <!-- 系统标识 -->
    <text x="0" y="-20" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">
      高性能系统
    </text>
    <text x="0" y="-8" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">
      High-Performance System
    </text>
    
    <!-- 三个核心组件 -->
    <g opacity="0.9">
      <!-- 硬件(身体) -->
      <rect x="-50" y="5" width="30" height="15" fill="#48bb78" rx="3"/>
      <text x="-35" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="white" font-weight="bold">硬件</text>
      
      <!-- 软件(心智) -->
      <rect x="-15" y="5" width="30" height="15" fill="#ed8936" rx="3"/>
      <text x="0" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="white" font-weight="bold">软件</text>
      
      <!-- 操作系统(AI原生度) -->
      <rect x="20" y="5" width="30" height="15" fill="#9f7aea" rx="3"/>
      <text x="35" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="white" font-weight="bold">OS</text>
    </g>
    
    <!-- 系统状态指示器 -->
    <circle cx="45" cy="-25" r="6" fill="#48bb78">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="45" y="-21" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white" font-weight="bold">✓</text>
  </g>
  
  <!-- 三个维度的更新循环 -->
  
  <!-- 身体更新 (左上) -->
  <g transform="translate(80, 80)">
    <circle cx="0" cy="0" r="35" fill="none" stroke="#48bb78" stroke-width="3" stroke-dasharray="5,5" opacity="0.6">
      <animateTransform attributeName="transform" attributeType="XML" type="rotate" 
                        values="0 0 0;360 0 0" dur="8s" repeatCount="indefinite"/>
    </circle>
    
    <!-- 身体图标 -->
    <g fill="#48bb78">
      <circle cx="0" cy="-8" r="6"/>
      <rect x="-4" y="-2" width="8" height="12" rx="2"/>
      <rect x="-6" y="2" width="4" height="8"/>
      <rect x="2" y="2" width="4" height="8"/>
    </g>
    
    <text x="0" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#48bb78">
      身体更新
    </text>
    <text x="0" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="#4a5568">
      Hardware
    </text>
    
    <!-- 箭头指向中心 -->
    <path d="M 25 25 L 85 85" stroke="#48bb78" stroke-width="2" fill="none" marker-end="url(#arrow1)" opacity="0.7"/>
  </g>
  
  <!-- 心智更新 (右上) -->
  <g transform="translate(320, 80)">
    <circle cx="0" cy="0" r="35" fill="none" stroke="#ed8936" stroke-width="3" stroke-dasharray="5,5" opacity="0.6">
      <animateTransform attributeName="transform" attributeType="XML" type="rotate" 
                        values="0 0 0;-360 0 0" dur="10s" repeatCount="indefinite"/>
    </circle>
    
    <!-- 大脑图标 -->
    <g fill="#ed8936">
      <ellipse cx="0" cy="-5" rx="12" ry="8"/>
      <path d="M -8 -8 Q -12 -12 -8 -15 Q -4 -18 0 -15 Q 4 -18 8 -15 Q 12 -12 8 -8"/>
      <circle cx="-4" cy="-8" r="1" fill="white"/>
      <circle cx="4" cy="-8" r="1" fill="white"/>
    </g>
    
    <text x="0" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#ed8936">
      心智更新
    </text>
    <text x="0" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="#4a5568">
      Software
    </text>
    
    <!-- 箭头指向中心 -->
    <path d="M -25 25 L -85 85" stroke="#ed8936" stroke-width="2" fill="none" marker-end="url(#arrow2)" opacity="0.7"/>
  </g>
  
  <!-- AI原生度更新 (下方) -->
  <g transform="translate(200, 230)">
    <circle cx="0" cy="0" r="35" fill="none" stroke="#9f7aea" stroke-width="3" stroke-dasharray="5,5" opacity="0.6">
      <animateTransform attributeName="transform" attributeType="XML" type="rotate" 
                        values="0 0 0;360 0 0" dur="6s" repeatCount="indefinite"/>
    </circle>
    
    <!-- AI图标 -->
    <g fill="#9f7aea">
      <circle cx="0" cy="-5" r="8" opacity="0.3"/>
      <rect x="-6" y="-9" width="12" height="8" rx="2" opacity="0.7"/>
      <circle cx="-3" cy="-5" r="1" fill="white"/>
      <circle cx="3" cy="-5" r="1" fill="white"/>
      <rect x="-4" y="-2" width="8" height="1" fill="white"/>
      
      <!-- 连接线表示AI网络 -->
      <g opacity="0.5">
        <line x1="-8" y1="-5" x2="-12" y2="-8" stroke="#9f7aea" stroke-width="1"/>
        <line x1="8" y1="-5" x2="12" y2="-8" stroke="#9f7aea" stroke-width="1"/>
        <line x1="0" y1="3" x2="0" y2="8" stroke="#9f7aea" stroke-width="1"/>
        <circle cx="-12" cy="-8" r="2" fill="#9f7aea"/>
        <circle cx="12" cy="-8" r="2" fill="#9f7aea"/>
        <circle cx="0" cy="8" r="2" fill="#9f7aea"/>
      </g>
    </g>
    
    <text x="0" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#9f7aea">
      AI原生度更新
    </text>
    <text x="0" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="#4a5568">
      Operating System
    </text>
    
    <!-- 箭头指向中心 -->
    <path d="M 0 -35 L 0 -65" stroke="#9f7aea" stroke-width="2" fill="none" marker-end="url(#arrow3)" opacity="0.7"/>
  </g>
  
  <!-- 箭头标记 -->
  <defs>
    <marker id="arrow1" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#48bb78" />
    </marker>
    <marker id="arrow2" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#ed8936" />
    </marker>
    <marker id="arrow3" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#9f7aea" />
    </marker>
  </defs>
  
  <!-- 持续循环指示 -->
  <g transform="translate(200, 150)">
    <circle cx="0" cy="0" r="80" fill="none" stroke="url(#renewalGradient)" stroke-width="2" stroke-dasharray="10,5" opacity="0.4">
      <animateTransform attributeName="transform" attributeType="XML" type="rotate" 
                        values="0 0 0;360 0 0" dur="20s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- 更新循环文字 -->
  <text x="200" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#4a5568">
    持续维护 · 不断升级 · 永不停机
  </text>
</svg>