<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="engineGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ee5a52;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="fuelGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4ecdc4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#44a08d;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="maintenanceGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#45b7d1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3498db;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- 背景 -->
  <rect width="400" height="300" fill="#f8fafc"/>
  
  <!-- 标题 -->
  <text x="200" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2d3748">
    身体更新：为高性能引擎加最好的油
  </text>
  
  <!-- F1赛车引擎 (中央) -->
  <g transform="translate(200, 140)">
    <!-- 引擎主体 -->
    <rect x="-40" y="-25" width="80" height="50" fill="url(#engineGradient)" rx="8" filter="url(#shadow)"/>
    
    <!-- 引擎细节 -->
    <rect x="-35" y="-20" width="70" height="8" fill="#c0392b" rx="2"/>
    <rect x="-35" y="-8" width="70" height="8" fill="#c0392b" rx="2"/>
    <rect x="-35" y="4" width="70" height="8" fill="#c0392b" rx="2"/>
    <rect x="-35" y="16" width="70" height="8" fill="#c0392b" rx="2"/>
    
    <!-- 散热器 -->
    <rect x="-45" y="-15" width="6" height="30" fill="#95a5a6" rx="1"/>
    <rect x="39" y="-15" width="6" height="30" fill="#95a5a6" rx="1"/>
    
    <!-- 引擎标识 -->
    <text x="0" y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">
      身体引擎
    </text>
    
    <!-- 性能指示灯 -->
    <circle cx="25" cy="-30" r="4" fill="#2ecc71">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="25" y="-24" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="#2ecc71" font-weight="bold">
      高性能
    </text>
  </g>
  
  <!-- 左侧：优质燃料 (营养) -->
  <g transform="translate(80, 100)">
    <text x="0" y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#44a08d">
      优质燃料
    </text>
    
    <!-- 燃料罐 -->
    <rect x="-15" y="10" width="30" height="40" fill="url(#fuelGradient)" rx="5" filter="url(#shadow)"/>
    <rect x="-12" y="15" width="24" height="30" fill="#ffffff" opacity="0.3" rx="3"/>
    
    <!-- 燃料液面 -->
    <rect x="-12" y="25" width="24" height="20" fill="#2ecc71" opacity="0.7" rx="3">
      <animate attributeName="y" values="25;23;25" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="height" values="20;22;20" dur="3s" repeatCount="indefinite"/>
    </rect>
    
    <!-- 燃料标识 -->
    <text x="0" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white" font-weight="bold">
      营养
    </text>
    
    <!-- 说明文字 -->
    <text x="0" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#4a5568">
      均衡饮食
    </text>
    <text x="0" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#4a5568">
      充足水分
    </text>
    
    <!-- 连接线 -->
    <path d="M 20 30 Q 60 50 120 100" stroke="url(#fuelGradient)" stroke-width="3" fill="none" marker-end="url(#arrowFuel)" opacity="0.7"/>
  </g>
  
  <!-- 右上：定期维护 (运动) -->
  <g transform="translate(320, 80)">
    <text x="0" y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#3498db">
      定期维护
    </text>
    
    <!-- 维护工具 -->
    <g fill="url(#maintenanceGradient)">
      <!-- 扳手 -->
      <rect x="-8" y="15" width="16" height="3" rx="1" transform="rotate(45)"/>
      <circle cx="-6" cy="18" r="3" transform="rotate(45)"/>
      <circle cx="6" cy="18" r="3" transform="rotate(45)"/>
      
      <!-- 螺丝刀 -->
      <rect x="-2" y="25" width="4" height="15" fill="#34495e"/>
      <rect x="-3" y="40" width="6" height="5" fill="#3498db" rx="1"/>
    </g>
    
    <!-- 说明文字 -->
    <text x="0" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#4a5568">
      规律运动
    </text>
    <text x="0" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#4a5568">
      身体保养
    </text>
    
    <!-- 连接线 -->
    <path d="M -20 40 Q -60 60 -120 110" stroke="url(#maintenanceGradient)" stroke-width="3" fill="none" marker-end="url(#arrowMaintenance)" opacity="0.7"/>
  </g>
  
  <!-- 右下：冷却时间 (睡眠) -->
  <g transform="translate(320, 200)">
    <text x="0" y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#9b59b6">
      冷却时间
    </text>
    
    <!-- 睡眠图标 -->
    <g>
      <!-- 月亮 -->
      <path d="M -5 15 Q -15 10 -15 25 Q -15 40 -5 35 Q 5 40 5 25 Q 5 10 -5 15 Z" 
            fill="#f39c12" opacity="0.8"/>
      <circle cx="0" cy="25" r="12" fill="#2c3e50" opacity="0.6"/>
      
      <!-- 星星 -->
      <g fill="#f1c40f" opacity="0.8">
        <polygon points="8,12 10,16 14,16 11,19 12,23 8,21 4,23 5,19 2,16 6,16" transform="scale(0.6)"/>
        <polygon points="15,25 17,29 21,29 18,32 19,36 15,34 11,36 12,32 9,29 13,29" transform="scale(0.4)"/>
        <polygon points="12,35 14,39 18,39 15,42 16,46 12,44 8,46 9,42 6,39 10,39" transform="scale(0.3)"/>
      </g>
    </g>
    
    <!-- 说明文字 -->
    <text x="0" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#4a5568">
      充足睡眠
    </text>
    <text x="0" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#4a5568">
      休息恢复
    </text>
    
    <!-- 连接线 -->
    <path d="M -20 20 Q -60 -20 -120 -35" stroke="#9b59b6" stroke-width="3" fill="none" marker-end="url(#arrowSleep)" opacity="0.7"/>
  </g>
  
  <!-- 左下：性能输出 -->
  <g transform="translate(80, 220)">
    <text x="0" y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#e67e22">
      性能输出
    </text>
    
    <!-- 速度表 -->
    <circle cx="0" cy="25" r="20" fill="white" stroke="#34495e" stroke-width="2"/>
    <circle cx="0" cy="25" r="15" fill="none" stroke="#e67e22" stroke-width="2" stroke-dasharray="47" stroke-dashoffset="0">
      <animate attributeName="stroke-dashoffset" values="47;0;47" dur="4s" repeatCount="indefinite"/>
    </circle>
    
    <!-- 指针 -->
    <line x1="0" y1="25" x2="12" y2="18" stroke="#e74c3c" stroke-width="2" transform-origin="0 25">
      <animateTransform attributeName="transform" attributeType="XML" type="rotate" 
                        values="0 0 25;90 0 25;0 0 25" dur="4s" repeatCount="indefinite"/>
    </line>
    <circle cx="0" cy="25" r="2" fill="#e74c3c"/>
    
    <!-- 说明文字 -->
    <text x="0" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#4a5568">
      高效工作
    </text>
    <text x="0" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#4a5568">
      持续精力
    </text>
    
    <!-- 连接线 -->
    <path d="M 20 35 Q 60 15 120 105" stroke="#e67e22" stroke-width="3" fill="none" marker-end="url(#arrowOutput)" opacity="0.7"/>
  </g>
  
  <!-- 箭头标记 -->
  <defs>
    <marker id="arrowFuel" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="url(#fuelGradient)" />
    </marker>
    <marker id="arrowMaintenance" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="url(#maintenanceGradient)" />
    </marker>
    <marker id="arrowSleep" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#9b59b6" />
    </marker>
    <marker id="arrowOutput" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#e67e22" />
    </marker>
  </defs>
  
  <!-- 底部说明 -->
  <text x="200" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#4a5568">
    为你的高性能引擎，加最好的油
  </text>
</svg>