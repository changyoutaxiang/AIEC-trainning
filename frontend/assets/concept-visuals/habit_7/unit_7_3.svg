<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ironManGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffd700;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="aiGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="transformGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00f2fe;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="humanGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffeaa7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fab1a0;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- 背景 -->
  <rect width="400" height="300" fill="#f8fafc"/>
  
  <!-- 标题 -->
  <text x="200" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2d3748">
    AI原生度更新：从Tony Stark到Iron Man
  </text>
  
  <!-- 转换箭头 -->
  <g transform="translate(200, 140)">
    <path d="M -60 0 L 60 0" stroke="url(#transformGradient)" stroke-width="4" fill="none" marker-end="url(#transformArrow)"/>
    <text x="0" y="-8" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#4facfe">
      AI增强转换
    </text>
    
    <!-- 转换能量流 -->
    <g opacity="0.6">
      <circle cx="-30" cy="0" r="3" fill="#4facfe">
        <animate attributeName="cx" values="-30;30" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="-10" cy="0" r="2" fill="#00f2fe">
        <animate attributeName="cx" values="-10;50" dur="2s" repeatCount="indefinite" begin="0.3s"/>
        <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" begin="0.3s"/>
      </circle>
      <circle cx="10" cy="0" r="2" fill="#4facfe">
        <animate attributeName="cx" values="10;70" dur="2s" repeatCount="indefinite" begin="0.6s"/>
        <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" begin="0.6s"/>
      </circle>
    </g>
  </g>
  
  <!-- 左侧：Tony Stark (人类专家) -->
  <g transform="translate(120, 140)">
    <!-- 人物轮廓 -->
    <g fill="url(#humanGradient)">
      <!-- 头部 -->
      <circle cx="0" cy="-25" r="12" filter="url(#shadow)"/>
      <!-- 身体 -->
      <rect x="-8" y="-10" width="16" height="30" rx="4" filter="url(#shadow)"/>
      <!-- 手臂 -->
      <rect x="-12" y="-5" width="6" height="20" rx="2"/>
      <rect x="6" y="-5" width="6" height="20" rx="2"/>
      <!-- 腿部 -->
      <rect x="-6" y="18" width="5" height="18" rx="2"/>
      <rect x="1" y="18" width="5" height="18" rx="2"/>
    </g>
    
    <!-- 人类特征 -->
    <g>
      <!-- 眼睛 -->
      <circle cx="-3" cy="-25" r="1" fill="#2d3748"/>
      <circle cx="3" cy="-25" r="1" fill="#2d3748"/>
      <!-- 嘴巴 -->
      <path d="M -2 -22 Q 0 -20 2 -22" stroke="#2d3748" stroke-width="1" fill="none"/>
      
      <!-- 工具/知识符号 -->
      <g opacity="0.8">
        <!-- 笔记本 -->
        <rect x="-15" y="-8" width="4" height="6" fill="#4299e1" rx="0.5"/>
        <rect x="-14.5" y="-7" width="3" height="0.5" fill="white"/>
        <rect x="-14.5" y="-5.5" width="3" height="0.5" fill="white"/>
        
        <!-- 计算器 -->
        <rect x="11" y="-3" width="4" height="5" fill="#48bb78" rx="0.5"/>
        <circle cx="12" cy="-1.5" r="0.3" fill="white"/>
        <circle cx="13" cy="-1.5" r="0.3" fill="white"/>
        <circle cx="14" cy="-1.5" r="0.3" fill="white"/>
      </g>
    </g>
    
    <!-- 标签 -->
    <text x="0" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#e67e22">
      Tony Stark
    </text>
    <text x="0" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#4a5568">
      人类专家
    </text>
    <text x="0" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#4a5568">
      依赖经验与直觉
    </text>
  </g>
  
  <!-- 右侧：Iron Man (AI增强人类) -->
  <g transform="translate(280, 140)">
    <!-- Iron Man 装甲 -->
    <g fill="url(#ironManGradient)" filter="url(#glow)">
      <!-- 头部装甲 -->
      <rect x="-10" y="-35" width="20" height="18" rx="6"/>
      <!-- 面罩眼部 -->
      <ellipse cx="-4" cy="-26" rx="2" ry="1" fill="#ffffff"/>
      <ellipse cx="4" cy="-26" rx="2" ry="1" fill="#ffffff"/>
      <ellipse cx="-4" cy="-26" rx="1" ry="0.5" fill="#4facfe">
        <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="4" cy="-26" rx="1" ry="0.5" fill="#4facfe">
        <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite"/>
      </ellipse>
      
      <!-- 胸部反应堆 -->
      <circle cx="0" cy="0" r="6" fill="#4facfe" opacity="0.9">
        <animate attributeName="r" values="6;8;6" dur="3s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.9;0.6;0.9" dur="3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="0" cy="0" r="3" fill="#ffffff"/>
      <circle cx="0" cy="0" r="2" fill="#4facfe"/>
      
      <!-- 身体装甲 -->
      <rect x="-12" y="-15" width="24" height="35" rx="6"/>
      
      <!-- 手臂装甲 -->
      <rect x="-18" y="-10" width="8" height="25" rx="3"/>
      <rect x="10" y="-10" width="8" height="25" rx="3"/>
      
      <!-- 腿部装甲 -->
      <rect x="-8" y="18" width="7" height="20" rx="3"/>
      <rect x="1" y="18" width="7" height="20" rx="3"/>
      
      <!-- 推进器 -->
      <circle cx="-14" cy="12" r="2" fill="#4facfe" opacity="0.8">
        <animate attributeName="opacity" values="0.8;0.4;0.8" dur="1.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="14" cy="12" r="2" fill="#4facfe" opacity="0.8">
        <animate attributeName="opacity" values="0.8;0.4;0.8" dur="1.5s" repeatCount="indefinite" begin="0.3s"/>
      </circle>
      <circle cx="-4" cy="35" r="2" fill="#4facfe" opacity="0.8">
        <animate attributeName="opacity" values="0.8;0.4;0.8" dur="1.5s" repeatCount="indefinite" begin="0.6s"/>
      </circle>
      <circle cx="4" cy="35" r="2" fill="#4facfe" opacity="0.8">
        <animate attributeName="opacity" values="0.8;0.4;0.8" dur="1.5s" repeatCount="indefinite" begin="0.9s"/>
      </circle>
    </g>
    
    <!-- AI辅助系统界面 -->
    <g opacity="0.7">
      <!-- HUD信息 -->
      <rect x="-25" y="-40" width="15" height="8" fill="none" stroke="#4facfe" stroke-width="0.5"/>
      <text x="-17.5" y="-35" text-anchor="middle" font-family="Arial, sans-serif" font-size="4" fill="#4facfe">TARGET</text>
      <text x="-17.5" y="-32" text-anchor="middle" font-family="Arial, sans-serif" font-size="3" fill="#4facfe">LOCKED</text>
      
      <!-- 数据流 -->
      <g stroke="#4facfe" stroke-width="1" fill="none" opacity="0.5">
        <line x1="12" y1="-35" x2="20" y2="-40">
          <animate attributeName="opacity" values="0.5;1;0.5" dur="1s" repeatCount="indefinite"/>
        </line>
        <line x1="12" y1="-30" x2="20" y2="-25">
          <animate attributeName="opacity" values="0.5;1;0.5" dur="1s" repeatCount="indefinite" begin="0.2s"/>
        </line>
        <line x1="12" y1="-25" x2="20" y2="-10">
          <animate attributeName="opacity" values="0.5;1;0.5" dur="1s" repeatCount="indefinite" begin="0.4s"/>
        </line>
      </g>
    </g>
    
    <!-- 标签 -->
    <text x="0" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#e74c3c">
      Iron Man
    </text>
    <text x="0" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#4a5568">
      AI增强人类
    </text>
    <text x="0" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#4a5568">
      智能+直觉的超能力
    </text>
  </g>
  
  <!-- 四个角落的AI能力要素 -->
  
  <!-- 左上：AI工具掌握 -->
  <g transform="translate(80, 60)">
    <text x="0" y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#667eea">
      AI工具掌握
    </text>
    
    <!-- 工具图标 -->
    <g>
      <!-- ChatGPT -->
      <circle cx="-10" cy="15" r="6" fill="#10a37f"/>
      <text x="-10" y="18" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="white" font-weight="bold">GPT</text>
      
      <!-- Claude -->
      <rect x="4" y="9" width="12" height="12" fill="#ff6b6b" rx="2"/>
      <text x="10" y="17" text-anchor="middle" font-family="Arial, sans-serif" font-size="5" fill="white" font-weight="bold">Claude</text>
      
      <!-- 连接线 -->
      <path d="M -4 15 L 4 15" stroke="#667eea" stroke-width="1" opacity="0.5"/>
    </g>
    
    <text x="0" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#4a5568">
      熟练使用AI助手
    </text>
  </g>
  
  <!-- 右上：思维协同 -->
  <g transform="translate(320, 60)">
    <text x="0" y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#9b59b6">
      思维协同
    </text>
    
    <!-- 协同图标 -->
    <g>
      <!-- 人脑 -->
      <ellipse cx="-8" cy="15" rx="6" ry="4" fill="#e67e22"/>
      <text x="-8" y="17" text-anchor="middle" font-family="Arial, sans-serif" font-size="4" fill="white">脑</text>
      
      <!-- AI -->
      <rect x="2" y="11" width="8" height="8" fill="#9b59b6" rx="2"/>
      <text x="6" y="17" text-anchor="middle" font-family="Arial, sans-serif" font-size="4" fill="white">AI</text>
      
      <!-- 协同连接 -->
      <g stroke="#9b59b6" stroke-width="2" fill="none">
        <path d="M -2 15 Q 2 10 6 15">
          <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
        </path>
        <path d="M -2 15 Q 2 20 6 15">
          <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite" begin="0.5s"/>
        </path>
      </g>
    </g>
    
    <text x="0" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#4a5568">
      人-AI协同思考
    </text>
  </g>
  
  <!-- 左下：自动化流程 -->
  <g transform="translate(80, 220)">
    <text x="0" y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#27ae60">
      自动化流程
    </text>
    
    <!-- 流程图标 -->
    <g>
      <!-- 输入 -->
      <rect x="-15" y="10" width="8" height="6" fill="#3498db" rx="1"/>
      <text x="-11" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="4" fill="white">输入</text>
      
      <!-- 处理 -->
      <circle cx="0" cy="13" r="4" fill="#27ae60"/>
      <text x="0" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="4" fill="white">AI</text>
      
      <!-- 输出 -->
      <rect x="7" y="10" width="8" height="6" fill="#e74c3c" rx="1"/>
      <text x="11" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="4" fill="white">输出</text>
      
      <!-- 流程箭头 -->
      <path d="M -7 13 L -4 13" stroke="#27ae60" stroke-width="1" marker-end="url(#smallArrow)"/>
      <path d="M 4 13 L 7 13" stroke="#27ae60" stroke-width="1" marker-end="url(#smallArrow)"/>
    </g>
    
    <text x="0" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#4a5568">
      工作流程自动化
    </text>
  </g>
  
  <!-- 右下：持续学习 -->
  <g transform="translate(320, 220)">
    <text x="0" y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#f39c12">
      持续学习
    </text>
    
    <!-- 学习循环 -->
    <g>
      <circle cx="0" cy="15" r="8" fill="none" stroke="#f39c12" stroke-width="2" stroke-dasharray="3,2">
        <animateTransform attributeName="transform" attributeType="XML" type="rotate" 
                          values="0 0 15;360 0 15" dur="4s" repeatCount="indefinite"/>
      </circle>
      
      <!-- 中心学习符号 -->
      <rect x="-3" y="11" width="6" height="8" fill="#f39c12" rx="1"/>
      <rect x="-2" y="13" width="4" height="1" fill="white"/>
      <rect x="-2" y="15" width="4" height="1" fill="white"/>
      <rect x="-2" y="17" width="4" height="1" fill="white"/>
      
      <!-- 更新指示点 -->
      <circle cx="8" cy="15" r="2" fill="#f39c12">
        <animate attributeName="opacity" values="0.5;1;0.5" dur="1s" repeatCount="indefinite"/>
      </circle>
    </g>
    
    <text x="0" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#4a5568">
      技能持续升级
    </text>
  </g>
  
  <!-- 箭头标记 -->
  <defs>
    <marker id="transformArrow" markerWidth="12" markerHeight="8" refX="12" refY="4" orient="auto">
      <polygon points="0 0, 12 4, 0 8" fill="url(#transformGradient)" />
    </marker>
    <marker id="smallArrow" markerWidth="6" markerHeight="4" refX="6" refY="2" orient="auto">
      <polygon points="0 0, 6 2, 0 4" fill="#27ae60" />
    </marker>
  </defs>
  
  <!-- 底部说明 -->
  <text x="200" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#4a5568">
    成为AI时代的超级英雄
  </text>
</svg>