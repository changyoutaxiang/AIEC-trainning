<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="valueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff9a9e;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#fecfef;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fecfef;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="deliveryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="gemGradient" cx="30%" cy="30%" r="70%">
      <stop offset="0%" style="stop-color:#ffd700;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#ff6b6b;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#ee5a52;stop-opacity:0.6" />
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="#fafafa"/>
  
  <!-- Title -->
  <text x="200" y="30" text-anchor="middle" fill="#2d3748" font-family="system-ui, -apple-system" font-size="16" font-weight="600">价值前置</text>
  <text x="200" y="48" text-anchor="middle" fill="#718096" font-family="system-ui" font-size="12">以终为始地设计你的交付物</text>
  
  <!-- Central diamond/gem representing value -->
  <g transform="translate(200, 130)">
    <!-- Main diamond shape -->
    <polygon points="0,-30 25,-10 15,25 -15,25 -25,-10" fill="url(#gemGradient)" stroke="#e53e3e" stroke-width="2"/>
    
    <!-- Inner facets -->
    <polygon points="0,-30 10,-15 0,0 -10,-15" fill="white" opacity="0.3"/>
    <polygon points="10,-15 25,-10 5,10 0,0" fill="white" opacity="0.2"/>
    <polygon points="0,0 5,10 15,25 -15,25 -5,10" fill="white" opacity="0.1"/>
    
    <!-- Sparkle effects -->
    <g opacity="0.8">
      <path d="M-35,-15 L-30,-15 L-32.5,-10 L-35,-15 L-32.5,-20 Z" fill="#ffd700"/>
      <path d="M35,-5 L40,-5 L37.5,0 L35,-5 L37.5,-10 Z" fill="#ffd700"/>
      <path d="M-20,35 L-15,35 L-17.5,40 L-20,35 L-17.5,30 Z" fill="#ffd700"/>
      <path d="M20,40 L25,40 L22.5,45 L20,40 L22.5,35 Z" fill="#ffd700"/>
    </g>
    
    <!-- Value label -->
    <text x="0" y="50" text-anchor="middle" fill="#2d3748" font-size="14" font-weight="600">核心价值</text>
  </g>
  
  <!-- Value dimensions around the gem -->
  <g transform="translate(200, 130)">
    <!-- User Value -->
    <g transform="translate(-70, -40)">
      <circle cx="0" cy="0" r="20" fill="#48bb78" opacity="0.2"/>
      <path d="M-8,-8 C-8,-12 -4,-16 0,-16 C4,-16 8,-12 8,-8 L8,0 C8,8 0,16 0,16 C0,16 -8,8 -8,0 Z" fill="#48bb78"/>
      <circle cx="0" cy="-8" r="4" fill="white"/>
      <text x="0" y="35" text-anchor="middle" fill="#2d3748" font-size="10" font-weight="500">用户价值</text>
    </g>
    
    <!-- Business Value -->
    <g transform="translate(70, -40)">
      <circle cx="0" cy="0" r="20" fill="#3182ce" opacity="0.2"/>
      <rect x="-6" y="-10" width="12" height="8" fill="#3182ce"/>
      <polygon points="-8,-2 -4,6 4,6 8,-2" fill="#3182ce"/>
      <circle cx="0" cy="-6" r="2" fill="white"/>
      <text x="0" y="35" text-anchor="middle" fill="#2d3748" font-size="10" font-weight="500">业务价值</text>
    </g>
    
    <!-- Technical Excellence -->
    <g transform="translate(-70, 40)">
      <circle cx="0" cy="0" r="20" fill="#805ad5" opacity="0.2"/>
      <rect x="-8" y="-6" width="16" height="2" fill="#805ad5"/>
      <rect x="-6" y="-2" width="12" height="2" fill="#805ad5"/>
      <rect x="-4" y="2" width="8" height="2" fill="#805ad5"/>
      <rect x="-2" y="6" width="4" height="2" fill="#805ad5"/>
      <text x="0" y="35" text-anchor="middle" fill="#2d3748" font-size="10" font-weight="500">技术卓越</text>
    </g>
    
    <!-- Team Impact -->
    <g transform="translate(70, 40)">
      <circle cx="0" cy="0" r="20" fill="#e53e3e" opacity="0.2"/>
      <circle cx="-6" cy="-3" r="4" fill="#e53e3e"/>
      <circle cx="6" cy="-3" r="4" fill="#e53e3e"/>
      <circle cx="0" cy="6" r="4" fill="#e53e3e"/>
      <path d="M-6,-3 L6,-3 L0,6 Z" fill="white" opacity="0.3"/>
      <text x="0" y="35" text-anchor="middle" fill="#2d3748" font-size="10" font-weight="500">团队影响</text>
    </g>
  </g>
  
  <!-- Connection lines -->
  <g stroke="#cbd5e0" stroke-width="1" stroke-dasharray="3,2" opacity="0.6">
    <line x1="130" y1="90" x2="185" y2="115"/>
    <line x1="270" y1="90" x2="215" y2="115"/>
    <line x1="130" y1="170" x2="185" y2="145"/>
    <line x1="270" y1="170" x2="215" y2="145"/>
  </g>
  
  <!-- Delivery process -->
  <g transform="translate(50, 220)">
    <text x="0" y="0" fill="#4a5568" font-size="11" font-weight="500">价值前置设计流程：</text>
    
    <!-- Step 1 -->
    <g transform="translate(0, 20)">
      <circle cx="8" cy="0" r="8" fill="url(#deliveryGradient)" opacity="0.8"/>
      <text x="8" y="3" text-anchor="middle" fill="white" font-size="8" font-weight="bold">1</text>
      <text x="22" y="3" fill="#4a5568" font-size="10">明确接收者 - 谁是你的用户？</text>
    </g>
    
    <!-- Step 2 -->
    <g transform="translate(0, 38)">
      <circle cx="8" cy="0" r="8" fill="url(#deliveryGradient)" opacity="0.8"/>
      <text x="8" y="3" text-anchor="middle" fill="white" font-size="8" font-weight="bold">2</text>
      <text x="22" y="3" fill="#4a5568" font-size="10">定义成功 - 什么算做有价值？</text>
    </g>
    
    <!-- Step 3 -->
    <g transform="translate(120, 20)">
      <circle cx="8" cy="0" r="8" fill="url(#deliveryGradient)" opacity="0.8"/>
      <text x="8" y="3" text-anchor="middle" fill="white" font-size="8" font-weight="bold">3</text>
      <text x="22" y="3" fill="#4a5568" font-size="10">逆向设计 - 从结果倒推过程</text>
    </g>
    
    <!-- Step 4 -->
    <g transform="translate(120, 38)">
      <circle cx="8" cy="0" r="8" fill="url(#deliveryGradient)" opacity="0.8"/>
      <text x="8" y="3" text-anchor="middle" fill="white" font-size="8" font-weight="bold">4</text>
      <text x="22" y="3" fill="#4a5568" font-size="10">持续验证 - 价值是否实现？</text>
    </g>
  </g>
  
  <!-- Quality indicators -->
  <g transform="translate(320, 80)">
    <!-- Excellence symbol -->
    <circle cx="0" cy="0" r="15" fill="#ffd700" opacity="0.2"/>
    <polygon points="0,-10 3,-3 10,-3 5,2 7,9 0,5 -7,9 -5,2 -10,-3 -3,-3" fill="#ffd700"/>
    <text x="0" y="25" text-anchor="middle" fill="#2d3748" font-size="9" font-weight="500">卓越交付</text>
  </g>
</svg>