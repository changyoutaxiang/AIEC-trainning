<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 渐变定义 -->
    <radialGradient id="blueGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#4682B4;stop-opacity:1"/>
    </radialGradient>
    <radialGradient id="greenGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#90EE90;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#228B22;stop-opacity:1"/>
    </radialGradient>
    <radialGradient id="purpleGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#DDA0DD;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#8A2BE2;stop-opacity:1"/>
    </radialGradient>
    <radialGradient id="resultGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:0.8"/>
      <stop offset="50%" style="stop-color:#FF6347;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#FF1493;stop-opacity:0.4"/>
    </radialGradient>
    <!-- 光晕效果 -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- 背景 -->
  <rect width="800" height="600" fill="#f8f9fa"/>
  <!-- 标题 -->
  <text x="400" y="60" text-anchor="middle" font-family="微软雅黑, sans-serif" font-size="36" font-weight="bold" fill="#2c3e50">
    统合综效：1+1=∞
  </text>
  <!-- 个体A -->
  <circle cx="200" cy="200" r="60" fill="url(#blueGradient)" filter="url(#glow)"/>
  <text x="200" y="210" text-anchor="middle" font-family="微软雅黑, sans-serif" font-size="32" font-weight="bold" fill="white">A</text>
  <text x="200" y="280" text-anchor="middle" font-family="微软雅黑, sans-serif" font-size="18" fill="#34495e">个体视角</text>
  <!-- 个体B -->
  <circle cx="600" cy="200" r="60" fill="url(#greenGradient)" filter="url(#glow)"/>
  <text x="600" y="210" text-anchor="middle" font-family="微软雅黑, sans-serif" font-size="32" font-weight="bold" fill="white">B</text>
  <text x="600" y="280" text-anchor="middle" font-family="微软雅黑, sans-serif" font-size="18" fill="#34495e">个体视角</text>
  <!-- 连接箭头 -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#8A2BE2"/>
    </marker>
  </defs>
  <path d="M 260 180 Q 400 120 540 180" stroke="#8A2BE2" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 540 220 Q 400 280 260 220" stroke="#8A2BE2" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  <!-- 中心协作创新圆圈 -->
  <circle cx="400" cy="200" r="80" fill="url(#purpleGradient)" filter="url(#glow)"/>
  <text x="400" y="195" text-anchor="middle" font-family="微软雅黑, sans-serif" font-size="20" font-weight="bold" fill="white">协作</text>
  <text x="400" y="215" text-anchor="middle" font-family="微软雅黑, sans-serif" font-size="20" font-weight="bold" fill="white">创新</text>
  <!-- 向下箭头 -->
  <path d="M 400 290 L 400 340" stroke="#8A2BE2" stroke-width="4" fill="none" marker-end="url(#arrowhead)"/>
  <!-- 第三选择结果 -->
  <circle cx="400" cy="420" r="100" fill="url(#resultGradient)" filter="url(#glow)" opacity="0.8"/>
  <!-- 无限符号 -->
  <path d="M 360 420 Q 380 400 400 420 Q 420 440 440 420 Q 420 400 400 420 Q 380 440 360 420" stroke="#FF1493" stroke-width="4" fill="none"/>
  <!-- 底部说明文字 -->
  <text x="400" y="550" text-anchor="middle" font-family="微软雅黑, sans-serif" font-size="20" font-weight="bold" fill="#2c3e50">
    创造超越所有初始方案的第三选择
  </text>
  <!-- 装饰性星星 -->
  <g fill="#FFD700" opacity="0.7">
    <polygon points="350,360 355,375 370,375 358,385 363,400 350,390 337,400 342,385 330,375 345,375" transform="scale(0.8)"/>
    <polygon points="450,360 455,375 470,375 458,385 463,400 450,390 437,400 442,385 430,375 445,375" transform="scale(0.8)"/>
    <polygon points="400,340 405,355 420,355 408,365 413,380 400,370 387,380 392,365 380,355 395,355" transform="scale(0.6)"/>
  </g>
  <!-- 数字示例 -->
  <text x="120" y="380" font-family="微软雅黑, sans-serif" font-size="16" fill="#7f8c8d">妥协: 1+1=1.5</text>
  <text x="580" y="380" font-family="微软雅黑, sans-serif" font-size="16" fill="#e74c3c">统合: 1+1=3,10,100...</text>
</svg>