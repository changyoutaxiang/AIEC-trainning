<svg viewBox="0 0 1200 680" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 渐变定义 -->
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90E2;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#357ABD;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="redGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E74C3C;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#C0392B;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F1C40F;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#F39C12;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="tealGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1ABC9C;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#16A085;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="cardGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ECF0F1;stop-opacity:0.95"/>
      <stop offset="100%" style="stop-color:#BDC3C7;stop-opacity:0.95"/>
    </linearGradient>
    <radialGradient id="sunGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1"/>
      <stop offset="70%" style="stop-color:#FFA500;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#FF8C00;stop-opacity:1"/>
    </radialGradient>
    <!-- 阴影滤镜 -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="6" flood-color="#34495E" flood-opacity="0.15"/>
    </filter>
    <!-- 发光效果 -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- 背景 -->
  <rect width="1200" height="680" fill="#F8F9FA"/>
  <!-- 装饰性背景元素 - 重新平衡分布 -->
  <circle cx="150" cy="150" r="3" fill="#E8F4FD" opacity="0.6"/>
  <circle cx="1050" cy="150" r="4" fill="#FFF3E0" opacity="0.6"/>
  <circle cx="100" cy="500" r="2" fill="#E8F5E8" opacity="0.6"/>
  <circle cx="1100" cy="500" r="3" fill="#FCE4EC" opacity="0.6"/>
  <circle cx="200" cy="600" r="2" fill="#F3E5F5" opacity="0.6"/>
  <circle cx="1000" cy="600" r="3" fill="#E3F2FD" opacity="0.6"/>
  <!-- 主标题 - 居中 -->
  <text x="600" y="50" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#2C3E50">
    创造第三选择：统合综效的巅峰时刻
  </text>
  <!-- 三个阶段容器 - 重新调整位置使其平衡分布 -->
  <g id="stages">
    <!-- 阶段1：妥协分割 - 左侧 -->
    <g id="stage1" transform="translate(200, 100)">
      <text x="75" y="20" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="600" text-anchor="middle" fill="#34495E">
        阶段1：妥协分割
      </text>
      <!-- A圆圈 -->
      <circle cx="45" cy="70" r="25" fill="url(#blueGradient)" filter="url(#shadow)"/>
      <text x="45" y="77" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">A</text>
      <!-- B圆圈 -->
      <circle cx="105" cy="70" r="25" fill="url(#redGradient)" filter="url(#shadow)"/>
      <text x="105" y="77" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">B</text>
      <!-- 重叠效果 -->
      <ellipse cx="75" cy="70" rx="15" ry="20" fill="#9B59B6" opacity="0.7"/>
      <!-- 公式 -->
      <text x="75" y="120" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#7F8C8D">
        1+1=1.5
      </text>
    </g>
    <!-- 箭头1 - 调整位置 -->
    <g transform="translate(360, 150)">
      <path d="M 0 0 L 80 0 L 70 -8 M 80 0 L 70 8" stroke="#95A5A6" stroke-width="2" fill="none"/>
    </g>
    <!-- 阶段2：深度理解 - 中间 -->
    <g id="stage2" transform="translate(475, 100)">
      <text x="75" y="20" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="600" text-anchor="middle" fill="#34495E">
        阶段2：深度理解
      </text>
      <!-- 漏斗形状 -->
      <path d="M 35 45 L 115 45 L 95 95 L 55 95 Z" fill="url(#tealGradient)" filter="url(#shadow)"/>
      <!-- 漏斗内的点 -->
      <circle cx="50" cy="60" r="2" fill="#27AE60"/>
      <circle cx="75" cy="65" r="2" fill="#27AE60"/>
      <circle cx="100" cy="60" r="2" fill="#27AE60"/>
      <circle cx="60" cy="75" r="1.5" fill="#27AE60"/>
      <circle cx="90" cy="75" r="1.5" fill="#27AE60"/>
      <!-- 顶部标签 -->
      <circle cx="75" cy="35" r="12" fill="#E67E22" filter="url(#shadow)"/>
      <text x="75" y="40" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" text-anchor="middle" fill="white">观察</text>
      <!-- 底部文字 -->
      <text x="75" y="115" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" text-anchor="middle" fill="#34495E">
        深度分析
      </text>
    </g>
    <!-- 箭头2 - 调整位置 -->
    <g transform="translate(635, 150)">
      <path d="M 0 0 L 80 0 L 70 -8 M 80 0 L 70 8" stroke="#95A5A6" stroke-width="2" fill="none"/>
    </g>
    <!-- 阶段3：飞跃创新 - 右侧 -->
    <g id="stage3" transform="translate(750, 100)">
      <text x="75" y="20" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="600" text-anchor="middle" fill="#34495E">
        阶段3：飞跃创新
      </text>
      <!-- 太阳形状 -->
      <g transform="translate(75, 70)">
        <!-- 光芒 -->
        <g stroke="#FFB74D" stroke-width="2" opacity="0.8">
          <line x1="0" y1="-35" x2="0" y2="-25" stroke-dasharray="3,2"/>
          <line x1="25" y1="-25" x2="18" y2="-18" stroke-dasharray="3,2"/>
          <line x1="35" y1="0" x2="25" y2="0" stroke-dasharray="3,2"/>
          <line x1="25" y1="25" x2="18" y2="18" stroke-dasharray="3,2"/>
          <line x1="0" y1="35" x2="0" y2="25" stroke-dasharray="3,2"/>
          <line x1="-25" y1="25" x2="-18" y2="18" stroke-dasharray="3,2"/>
          <line x1="-35" y1="0" x2="-25" y2="0" stroke-dasharray="3,2"/>
          <line x1="-25" y1="-25" x2="-18" y2="-18" stroke-dasharray="3,2"/>
        </g>
        <!-- 中心圆 -->
        <circle cx="0" cy="0" r="20" fill="url(#sunGradient)" filter="url(#glow)"/>
        <text x="0" y="6" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">∞</text>
      </g>
      <!-- 公式 -->
      <text x="75" y="120" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#E67E22" font-weight="600">
        1+1=∞
      </text>
    </g>
  </g>
  <!-- 向下箭头 - 居中 -->
  <g transform="translate(600, 230)">
    <path d="M 0 0 L 0 50 L -10 40 M 0 50 L 10 40" stroke="#34495E" stroke-width="3" fill="none"/>
  </g>
  <!-- 核心概念区域 - 完全居中 -->
  <g id="core-concept" transform="translate(200, 300)">
    <!-- 主卡片 - 调整尺寸使其更平衡 -->
    <rect x="0" y="0" width="800" height="280" rx="20" ry="20" fill="url(#cardGradient)" filter="url(#shadow)"/>
    <!-- 创新标签 -->
    <circle cx="200" cy="40" r="15" fill="#E67E22" filter="url(#shadow)"/>
    <text x="200" y="46" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" text-anchor="middle" fill="white">突破</text>
    <!-- 协同标签 -->
    <circle cx="600" cy="40" r="15" fill="#27AE60" filter="url(#shadow)"/>
    <text x="600" y="46" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" text-anchor="middle" fill="white">协同</text>
    <!-- A方案 -->
    <circle cx="150" cy="130" r="35" fill="url(#blueGradient)" filter="url(#shadow)"/>
    <text x="150" y="138" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="white">A</text>
    <text x="150" y="180" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle" fill="#34495E">原有方案</text>
    <!-- C方案（中心） -->
    <circle cx="400" cy="130" r="45" fill="url(#sunGradient)" filter="url(#glow)"/>
    <text x="400" y="140" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="white">C</text>
    <!-- B方案 -->
    <circle cx="650" cy="130" r="35" fill="url(#redGradient)" filter="url(#shadow)"/>
    <text x="650" y="138" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="white">B</text>
    <text x="650" y="180" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle" fill="#34495E">原有方案</text>
    <!-- 连接线 - 调整路径 -->
    <path d="M 185 130 Q 292 110 355 130" stroke="#27AE60" stroke-width="4" fill="none" opacity="0.8"/>
    <path d="M 615 130 Q 508 110 445 130" stroke="#27AE60" stroke-width="4" fill="none" opacity="0.8"/>
    <!-- 文本内容 - 居中对齐 -->
    <text x="400" y="220" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#2C3E50">
      璀璨的第三选择
    </text>
    <text x="400" y="245" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16" text-anchor="middle" fill="#7F8C8D">
      统合综效的价值创造
    </text>
    <text x="400" y="265" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle" fill="#95A5A6">
      超越A和B，创造全新范式
    </text>
  </g>
  <!-- 底部说明 - 居中 -->
  <g transform="translate(600, 620)">
    <text x="0" y="0" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="600" text-anchor="middle" fill="#2C3E50">
      在互信安全的环境中，将不同观点作为创新催化剂
    </text>
    <text x="0" y="25" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="15" text-anchor="middle" fill="#7F8C8D">
      通过开放式探寻和创造性重组，设计定义行业的创新方案
    </text>
  </g>
  <!-- 装饰线条 - 增加平衡感 -->
  <line x1="50" y1="80" x2="1150" y2="80" stroke="#ECF0F1" stroke-width="1"/>
  <line x1="50" y1="660" x2="1150" y2="660" stroke="#ECF0F1" stroke-width="1"/>
</svg>