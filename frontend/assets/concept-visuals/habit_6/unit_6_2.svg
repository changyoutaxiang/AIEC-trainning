<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 渐变定义 -->
    <linearGradient id="safetyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#66BB6A;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#4CAF50;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="innovationGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9C27B0;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#7B1FA2;stop-opacity:1"/>
    </linearGradient>
    <radialGradient id="netGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#E8F5E8;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#C8E6C9;stop-opacity:0.7"/>
    </radialGradient>
    <!-- 阴影效果 -->
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
    <!-- 发光效果 -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- 背景 -->
  <rect width="800" height="600" fill="#f8f9fa"/>
  <!-- 标题 -->
  <text x="400" y="45" text-anchor="middle" font-family="微软雅黑, sans-serif" font-size="32" font-weight="bold" fill="#2c3e50">
    营造安全：心理安全网
  </text>
  <!-- 绳索支柱 -->
  <rect x="120" y="80" width="12" height="120" rx="2" fill="#5D4037" filter="url(#shadow)"/>
  <rect x="668" y="80" width="12" height="120" rx="2" fill="#5D4037" filter="url(#shadow)"/>
  <!-- 高空绳索 -->
  <line x1="132" y1="160" x2="668" y2="160" stroke="#8D6E63" stroke-width="6" filter="url(#shadow)"/>
  <!-- 人物在绳索上 -->
  <g transform="translate(400, 135)">
    <!-- 身体 -->
    <circle cx="0" cy="0" r="12" fill="#F4A460"/>
    <rect x="-8" y="12" width="16" height="25" rx="8" fill="#3498db"/>
    <!-- 手臂和平衡杆 -->
    <rect x="-35" y="8" width="70" height="4" rx="2" fill="#8D6E63"/>
    <circle cx="-35" cy="10" r="6" fill="#3498db"/>
    <circle cx="35" cy="10" r="6" fill="#3498db"/>
    <!-- 腿部 -->
    <rect x="-4" y="37" width="8" height="20" rx="4" fill="#2980b9"/>
  </g>
  <!-- 问号和想法气泡 -->
  <g transform="translate(300, 100)">
    <circle cx="0" cy="0" r="18" fill="#E3F2FD" stroke="#2196F3" stroke-width="2" filter="url(#shadow)"/>
    <text x="0" y="6" text-anchor="middle" font-family="微软雅黑, sans-serif" font-size="20" font-weight="bold" fill="#2196F3">?</text>
  </g>
  <text x="300" y="135" text-anchor="middle" font-family="微软雅黑, sans-serif" font-size="12" fill="#666">提问题</text>
  <g transform="translate(500, 100)">
    <circle cx="0" cy="0" r="18" fill="#FFF3E0" stroke="#FF9800" stroke-width="2" filter="url(#shadow)"/>
    <path d="M -8 -3 Q 0 -10 8 -3 Q 8 7 0 10 Q -8 7 -8 -3" fill="#FFB74D"/>
    <rect x="-3" y="10" width="6" height="4" rx="1" fill="#FF9800"/>
  </g>
  <text x="500" y="135" text-anchor="middle" font-family="微软雅黑, sans-serif" font-size="12" fill="#666">新想法</text>
  <!-- 心理安全和创新勇气标签 -->
  <rect x="60" y="220" width="90" height="50" rx="8" fill="url(#safetyGradient)" filter="url(#shadow)"/>
  <text x="105" y="240" text-anchor="middle" font-family="微软雅黑, sans-serif" font-size="14" font-weight="bold" fill="white">心理</text>
  <text x="105" y="255" text-anchor="middle" font-family="微软雅黑, sans-serif" font-size="14" font-weight="bold" fill="white">安全</text>
  <rect x="650" y="220" width="90" height="50" rx="8" fill="url(#innovationGradient)" filter="url(#shadow)"/>
  <text x="695" y="240" text-anchor="middle" font-family="微软雅黑, sans-serif" font-size="14" font-weight="bold" fill="white">创新</text>
  <text x="695" y="255" text-anchor="middle" font-family="微软雅黑, sans-serif" font-size="14" font-weight="bold" fill="white">勇气</text>
  <!-- 氧气分子群 -->
  <g opacity="0.6">
    <!-- 左侧氧气群 -->
    <circle cx="120" cy="190" r="6" fill="#A5D6A7"/>
    <circle cx="130" cy="185" r="4" fill="#81C784"/>
    <text x="125" y="210" font-family="微软雅黑, sans-serif" font-size="10" fill="#4CAF50">O₂</text>
    <circle cx="180" cy="200" r="5" fill="#A5D6A7"/>
    <circle cx="188" cy="196" r="3" fill="#81C784"/>
    <circle cx="90" cy="280" r="7" fill="#A5D6A7"/>
    <circle cx="101" cy="276" r="5" fill="#81C784"/>
    <text x="95" y="300" font-family="微软雅黑, sans-serif" font-size="10" fill="#4CAF50">O₂</text>
    <!-- 右侧氧气群 -->
    <circle cx="680" cy="190" r="6" fill="#A5D6A7"/>
    <circle cx="670" cy="185" r="4" fill="#81C784"/>
    <text x="675" y="210" font-family="微软雅黑, sans-serif" font-size="10" fill="#4CAF50">O₂</text>
    <circle cx="620" cy="200" r="5" fill="#A5D6A7"/>
    <circle cx="612" cy="196" r="3" fill="#81C784"/>
    <circle cx="710" cy="280" r="7" fill="#A5D6A7"/>
    <circle cx="699" cy="276" r="5" fill="#81C784"/>
    <text x="705" y="300" font-family="微软雅黑, sans-serif" font-size="10" fill="#4CAF50">O₂</text>
  </g>
  <!-- 中间过渡区域 - 下降的保护线 -->
  <g opacity="0.3">
    <path d="M 200 180 Q 250 220 300 260 Q 350 300 400 320 Q 450 300 500 260 Q 550 220 600 180" stroke="#4CAF50" stroke-width="1" fill="none" stroke-dasharray="3,3"/>
    <path d="M 180 200 Q 230 240 280 280 Q 330 320 400 340 Q 470 320 520 280 Q 570 240 620 200" stroke="#4CAF50" stroke-width="1" fill="none" stroke-dasharray="3,3"/>
  </g>
  <!-- 安全网 - 位置上移并加大 -->
  <ellipse cx="400" cy="380" rx="320" ry="90" fill="url(#netGradient)" filter="url(#shadow)"/>
  <!-- 网格图案 -->
  <g stroke="#4CAF50" stroke-width="2" fill="none" opacity="0.8">
    <!-- 水平网线 -->
    <path d="M 100 340 Q 180 335 260 340 Q 340 345 400 345 Q 460 345 540 340 Q 620 335 700 340"/>
    <path d="M 110 360 Q 190 355 270 360 Q 350 365 400 365 Q 450 365 530 360 Q 610 355 690 360"/>
    <path d="M 120 380 Q 200 375 280 380 Q 360 385 400 385 Q 440 385 520 380 Q 600 375 680 380"/>
    <path d="M 130 400 Q 210 395 290 400 Q 370 405 400 405 Q 430 405 510 400 Q 590 395 670 400"/>
    <path d="M 140 420 Q 220 415 300 420 Q 380 425 400 425 Q 420 425 500 420 Q 580 415 660 420"/>
    <path d="M 150 440 Q 230 435 310 440 Q 390 445 400 445 Q 410 445 490 440 Q 570 435 650 440"/>
    <!-- 垂直连接线 -->
    <path d="M 150 340 Q 145 360 150 380 Q 155 400 150 420 Q 145 440 150 460"/>
    <path d="M 220 335 Q 215 355 220 375 Q 225 395 220 415 Q 215 435 220 455"/>
    <path d="M 290 340 Q 285 360 290 380 Q 295 400 290 420 Q 285 440 290 460"/>
    <path d="M 400 345 Q 395 365 400 385 Q 405 405 400 425 Q 395 445 400 465"/>
    <path d="M 510 340 Q 505 360 510 380 Q 515 400 510 420 Q 505 440 510 460"/>
    <path d="M 580 335 Q 575 355 580 375 Q 585 395 580 415 Q 575 435 580 455"/>
    <path d="M 650 340 Q 645 360 650 380 Q 655 400 650 420 Q 645 440 650 460"/>
  </g>
  <!-- 安全网中心确认标记 -->
  <circle cx="400" cy="380" r="20" fill="#4CAF50" opacity="0.4" filter="url(#glow)"/>
  <path d="M 392 380 L 398 386 L 408 376" stroke="#2E7D32" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- 创新气泡上升效果 -->
  <g opacity="0.5">
    <circle cx="250" cy="320" r="3" fill="#9C27B0">
      <animate attributeName="cy" values="320;200;320" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.1;0.5" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="550" cy="330" r="4" fill="#2196F3">
      <animate attributeName="cy" values="330;210;330" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.1;0.5" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="350" cy="340" r="2" fill="#FF9800">
      <animate attributeName="cy" values="340;220;340" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.1;0.5" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="450" cy="335" r="3" fill="#4CAF50">
      <animate attributeName="cy" values="335;215;335" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.1;0.5" dur="3.5s" repeatCount="indefinite"/>
    </circle>
  </g>
  <!-- 对比说明 -->
  <text x="580" y="460" font-family="微软雅黑, sans-serif" font-size="12" fill="#666">对比：破损网</text>
  <text x="580" y="475" font-family="微软雅黑, sans-serif" font-size="12" fill="#e74c3c">→ 不敢创新</text>
  <!-- 底部主要文字 -->
  <text x="400" y="520" text-anchor="middle" font-family="微软雅黑, sans-serif" font-size="24" font-weight="bold" fill="#2c3e50">
    让每一个"傻"问题，都能被温柔以待
  </text>
</svg>