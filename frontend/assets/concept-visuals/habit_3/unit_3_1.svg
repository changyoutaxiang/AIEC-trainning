<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient definitions -->
    <radialGradient id="lensGradient" cx="50%" cy="30%" r="70%">
      <stop offset="0%" style="stop-color:#4facfe;stop-opacity:0.9"/>
      <stop offset="70%" style="stop-color:#00f2fe;stop-opacity:0.7"/>
      <stop offset="100%" style="stop-color:#667eea;stop-opacity:0.5"/>
    </radialGradient>
    <linearGradient id="taskGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f093fb;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#f5576c;stop-opacity:0.8"/>
    </linearGradient>
    <linearGradient id="holeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2d3748;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#1a202c;stop-opacity:0.9"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="#f8fafc"/>
  
  <!-- Title -->
  <text x="200" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2d3748">识别要事</text>
  <text x="200" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#4a5568">"用矩阵看清你的时间黑洞"</text>
  
  <!-- Main magnifying lens -->
  <g transform="translate(180, 120)">
    <!-- Lens body -->
    <circle cx="0" cy="0" r="45" fill="url(#lensGradient)" stroke="#2d3748" stroke-width="3"/>
    
    <!-- Lens handle -->
    <line x1="32" y1="32" x2="50" y2="50" stroke="#2d3748" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Inside lens - time holes visualization -->
    <g>
      <!-- Small scattered tasks (time drains) -->
      <circle cx="-20" cy="-15" r="6" fill="url(#holeGradient)"/>
      <text x="-20" y="-11" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="#ffffff">邮件</text>
      
      <circle cx="15" cy="-20" r="7" fill="url(#holeGradient)"/>
      <text x="15" y="-15" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="#ffffff">会议</text>
      
      <circle cx="-10" cy="18" r="5" fill="url(#holeGradient)"/>
      <text x="-10" y="22" text-anchor="middle" font-family="Arial, sans-serif" font-size="5" fill="#ffffff">救火</text>
      
      <circle cx="20" cy="15" r="6" fill="url(#holeGradient)"/>
      <text x="20" y="19" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="#ffffff">干扰</text>
      
      <!-- Important task highlighted -->
      <circle cx="-5" cy="0" r="10" fill="#ffd700" stroke="#ff6b6b" stroke-width="2"/>
      <text x="-5" y="-4" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#2d3748" font-weight="bold">重要</text>
      <text x="-5" y="4" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#2d3748" font-weight="bold">事务</text>
    </g>
  </g>
  
  <!-- Matrix framework around -->
  <g transform="translate(50, 160)">
    <!-- Horizontal axis: Urgent/Not Urgent -->
    <line x1="0" y1="60" x2="120" y2="60" stroke="#4a5568" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="60" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#4a5568">紧急程度</text>
    <text x="10" y="75" font-family="Arial, sans-serif" font-size="9" fill="#4a5568">低</text>
    <text x="105" y="75" font-family="Arial, sans-serif" font-size="9" fill="#4a5568">高</text>
    
    <!-- Vertical axis: Important/Not Important -->
    <line x1="60" y1="0" x2="60" y2="60" stroke="#4a5568" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="35" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#4a5568" transform="rotate(-90, 35, 30)">重要程度</text>
    <text x="45" y="55" font-family="Arial, sans-serif" font-size="9" fill="#4a5568">低</text>
    <text x="45" y="15" font-family="Arial, sans-serif" font-size="9" fill="#4a5568">高</text>
  </g>
  
  <!-- Arrow markers -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a5568"/>
    </marker>
  </defs>
  
  <!-- Task categories scattered around -->
  <g transform="translate(300, 80)">
    <!-- Quadrant I -->
    <rect x="0" y="0" width="35" height="25" fill="#ff6b6b" rx="3" opacity="0.8"/>
    <text x="17.5" y="10" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#ffffff" font-weight="bold">象限I</text>
    <text x="17.5" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="#ffffff">危机</text>
    
    <!-- Quadrant II (highlighted as focus) -->
    <rect x="0" y="35" width="35" height="25" fill="#4facfe" rx="3" stroke="#ffd700" stroke-width="2"/>
    <text x="17.5" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#ffffff" font-weight="bold">象限II</text>
    <text x="17.5" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="#ffffff">价值</text>
    
    <!-- Quadrant III -->
    <rect x="45" y="0" width="35" height="25" fill="#ffa726" rx="3" opacity="0.8"/>
    <text x="62.5" y="10" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#ffffff" font-weight="bold">象限III</text>
    <text x="62.5" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="#ffffff">干扰</text>
    
    <!-- Quadrant IV -->
    <rect x="45" y="35" width="35" height="25" fill="#9e9e9e" rx="3" opacity="0.8"/>
    <text x="62.5" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#ffffff" font-weight="bold">象限IV</text>
    <text x="62.5" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="#ffffff">浪费</text>
  </g>
  
  <!-- Focus arrow pointing to Quadrant II -->
  <g transform="translate(265, 130)">
    <path d="M0,0 Q10,-10 25,-5 Q30,0 25,5 Q10,10 0,0" fill="#ffd700" stroke="#ff6b6b" stroke-width="1"/>
    <text x="12" y="4" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#2d3748" font-weight="bold">聚焦</text>
  </g>
  
  <!-- Bottom insights -->
  <g transform="translate(50, 250)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="11" fill="#2d3748" font-weight="bold">核心洞察：</text>
    <text x="0" y="15" font-family="Arial, sans-serif" font-size="10" fill="#4a5568">• 识别真正的"要事"而非"急事"</text>
    <text x="0" y="30" font-family="Arial, sans-serif" font-size="10" fill="#4a5568">• 将精力从象限I、III转向象限II</text>
  </g>
</svg>