<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient definitions -->
    <linearGradient id="matrixGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:0.8"/>
    </linearGradient>
    <linearGradient id="timeGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f093fb;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#f5576c;stop-opacity:0.6"/>
    </linearGradient>
    <linearGradient id="selfGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4facfe;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#00f2fe;stop-opacity:0.8"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="#f8fafc"/>
  
  <!-- Title -->
  <text x="200" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2d3748">要事第一核心理念</text>
  
  <!-- Time Management Matrix (2x2 grid) -->
  <g transform="translate(50, 50)">
    <!-- Matrix background -->
    <rect x="0" y="0" width="200" height="150" fill="url(#matrixGradient)" rx="8"/>
    
    <!-- Grid lines -->
    <line x1="100" y1="0" x2="100" y2="150" stroke="#ffffff" stroke-width="2"/>
    <line x1="0" y1="75" x2="200" y2="75" stroke="#ffffff" stroke-width="2"/>
    
    <!-- Quadrant labels -->
    <text x="50" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#ffffff" font-weight="bold">象限I</text>
    <text x="150" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#ffffff" font-weight="bold">象限III</text>
    <text x="50" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#ffffff" font-weight="bold">象限II</text>
    <text x="150" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#ffffff" font-weight="bold">象限IV</text>
    
    <!-- Quadrant content -->
    <text x="50" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#ffffff">重要</text>
    <text x="50" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#ffffff">紧急</text>
    <text x="50" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#ffffff">🔥救火</text>
    
    <text x="150" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#ffffff">不重要</text>
    <text x="150" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#ffffff">紧急</text>
    <text x="150" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#ffffff">📞干扰</text>
    
    <text x="50" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#ffffff">重要</text>
    <text x="50" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#ffffff">不紧急</text>
    <text x="50" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#ffffff">⭐价值</text>
    
    <text x="150" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#ffffff">不重要</text>
    <text x="150" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#ffffff">不紧急</text>
    <text x="150" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#ffffff">📱浪费</text>
    
    <!-- Highlight Quadrant II -->
    <rect x="5" y="80" width="90" height="65" fill="none" stroke="#ffd700" stroke-width="3" rx="4" stroke-dasharray="5,5"/>
  </g>
  
  <!-- Arrow pointing to Quadrant II -->
  <g transform="translate(280, 120)">
    <path d="M0,0 L20,0 L15,-5 M20,0 L15,5" stroke="#ffd700" stroke-width="2" fill="none"/>
    <text x="25" y="5" font-family="Arial, sans-serif" font-size="11" fill="#2d3748" font-weight="bold">聚焦区域</text>
  </g>
  
  <!-- Core concept explanation -->
  <g transform="translate(50, 220)">
    <!-- Time cannot be managed -->
    <rect x="0" y="0" width="80" height="30" fill="url(#timeGradient)" rx="4"/>
    <text x="40" y="12" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#2d3748" font-weight="bold">时间</text>
    <text x="40" y="24" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#2d3748">无法管理</text>
    
    <!-- Arrow -->
    <text x="90" y="20" font-family="Arial, sans-serif" font-size="16" fill="#2d3748">→</text>
    
    <!-- Self can be managed -->
    <rect x="110" y="0" width="80" height="30" fill="url(#selfGradient)" rx="4"/>
    <text x="150" y="12" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#2d3748" font-weight="bold">自己</text>
    <text x="150" y="24" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#2d3748">可以管理</text>
    
    <!-- Key insight -->
    <text x="200" y="15" font-family="Arial, sans-serif" font-size="10" fill="#2d3748" font-weight="bold">管理选择，主导人生</text>
  </g>
  
  <!-- Bottom tagline -->
  <text x="200" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#4a5568" font-style="italic">"从管理时间，到管理自己"</text>
</svg>