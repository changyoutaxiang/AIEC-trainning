<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient definitions -->
    <linearGradient id="calendarGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:0.9"/>
      <stop offset="50%" style="stop-color:#764ba2;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#f093fb;stop-opacity:0.7"/>
    </linearGradient>
    <linearGradient id="weekGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4facfe;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#00f2fe;stop-opacity:0.8"/>
    </linearGradient>
    <radialGradient id="crownGradient" cx="50%" cy="30%" r="70%">
      <stop offset="0%" style="stop-color:#ffd700;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#ffb347;stop-opacity:0.8"/>
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="#f8fafc"/>
  
  <!-- Title -->
  <text x="200" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2d3748">规划要事</text>
  <text x="200" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#4a5568">"成为自己一周的主人"</text>
  
  <!-- Crown symbol for mastery -->
  <g transform="translate(200, 60)">
    <path d="M-15,-10 L-10,-20 L-5,-15 L0,-25 L5,-15 L10,-20 L15,-10 L10,-5 L-10,-5 Z" fill="url(#crownGradient)" stroke="#d4a574" stroke-width="1"/>
    <circle cx="-7" cy="-12" r="2" fill="#ff6b6b"/>
    <circle cx="0" cy="-20" r="3" fill="#4facfe"/>
    <circle cx="7" cy="-12" r="2" fill="#ff6b6b"/>
    <text x="0" y="10" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2d3748" font-weight="bold">一周之主</text>
  </g>
  
  <!-- Weekly calendar layout -->
  <g transform="translate(50, 100)">
    <!-- Calendar background -->
    <rect x="0" y="0" width="300" height="120" fill="url(#calendarGradient)" rx="8" opacity="0.1"/>
    
    <!-- Week days -->
    <g>
      <!-- Days of week header -->
      <rect x="0" y="0" width="300" height="20" fill="url(#weekGradient)" rx="4"/>
      <text x="21" y="14" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#ffffff" font-weight="bold">周一</text>
      <text x="64" y="14" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#ffffff" font-weight="bold">周二</text>
      <text x="107" y="14" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#ffffff" font-weight="bold">周三</text>
      <text x="150" y="14" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#ffffff" font-weight="bold">周四</text>
      <text x="193" y="14" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#ffffff" font-weight="bold">周五</text>
      <text x="236" y="14" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#ffffff" font-weight="bold">周六</text>
      <text x="279" y="14" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#ffffff" font-weight="bold">周日</text>
      
      <!-- Vertical lines -->
      <line x1="43" y1="0" x2="43" y2="120" stroke="#e2e8f0" stroke-width="1"/>
      <line x1="86" y1="0" x2="86" y2="120" stroke="#e2e8f0" stroke-width="1"/>
      <line x1="129" y1="0" x2="129" y2="120" stroke="#e2e8f0" stroke-width="1"/>
      <line x1="172" y1="0" x2="172" y2="120" stroke="#e2e8f0" stroke-width="1"/>
      <line x1="215" y1="0" x2="215" y2="120" stroke="#e2e8f0" stroke-width="1"/>
      <line x1="258" y1="0" x2="258" y2="120" stroke="#e2e8f0" stroke-width="1"/>
      
      <!-- Horizontal time slots -->
      <line x1="0" y1="40" x2="300" y2="40" stroke="#e2e8f0" stroke-width="1"/>
      <line x1="0" y1="60" x2="300" y2="60" stroke="#e2e8f0" stroke-width="1"/>
      <line x1="0" y1="80" x2="300" y2="80" stroke="#e2e8f0" stroke-width="1"/>
      <line x1="0" y1="100" x2="300" y2="100" stroke="#e2e8f0" stroke-width="1"/>
    </g>
    
    <!-- Important events scheduled (Quadrant II blocks) -->
    <!-- Monday morning - Strategic planning -->
    <rect x="2" y="22" width="39" height="16" fill="#4facfe" rx="2" opacity="0.8"/>
    <text x="21.5" y="32" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#ffffff">战略规划</text>
    
    <!-- Wednesday evening - Learning -->
    <rect x="88" y="82" width="39" height="16" fill="#4facfe" rx="2" opacity="0.8"/>
    <text x="107.5" y="92" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#ffffff">学习时间</text>
    
    <!-- Friday morning - Innovation project -->
    <rect x="174" y="22" width="39" height="16" fill="#4facfe" rx="2" opacity="0.8"/>
    <text x="193.5" y="32" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#ffffff">创新项目</text>
    
    <!-- Sunday planning -->
    <rect x="260" y="102" width="39" height="16" fill="#ffd700" rx="2" opacity="0.9"/>
    <text x="279.5" y="112" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#2d3748">下周规划</text>
    
    <!-- Urgent tasks (showing less priority) -->
    <rect x="45" y="42" width="39" height="12" fill="#ffa726" rx="2" opacity="0.6"/>
    <text x="64.5" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="#ffffff">紧急邮件</text>
    
    <rect x="131" y="62" width="39" height="12" fill="#ffa726" rx="2" opacity="0.6"/>
    <text x="150.5" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="#ffffff">临时会议</text>
  </g>
  
  <!-- Role-based planning concept -->
  <g transform="translate(60, 240)">
    <!-- Roles as foundation -->
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="11" fill="#2d3748" font-weight="bold">多角色规划：</text>
    
    <!-- Role blocks -->
    <rect x="100" y="-12" width="50" height="15" fill="#667eea" rx="2" opacity="0.8"/>
    <text x="125" y="-2" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#ffffff">项目成员</text>
    
    <rect x="155" y="-12" width="40" height="15" fill="#f093fb" rx="2" opacity="0.8"/>
    <text x="175" y="-2" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#ffffff">学习者</text>
    
    <rect x="200" y="-12" width="50" height="15" fill="#4facfe" rx="2" opacity="0.8"/>
    <text x="225" y="-2" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#ffffff">家庭成员</text>
    
    <!-- Planning arrow -->
    <path d="M90,8 Q95,5 100,8" stroke="#2d3748" stroke-width="1" fill="none" marker-end="url(#planningArrow)"/>
    <text x="70" y="20" font-family="Arial, sans-serif" font-size="9" fill="#4a5568">为每个角色设定目标</text>
  </g>
  
  <!-- Arrow marker -->
  <defs>
    <marker id="planningArrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2d3748"/>
    </marker>
  </defs>
  
  <!-- Key principles on the right -->
  <g transform="translate(370, 110)">
    <!-- Weekly view benefits -->
    <g transform="rotate(90)">
      <text x="0" y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#4a5568" font-weight="bold">周计划优势</text>
      <text x="0" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#4a5568">• 跳出日常救火</text>
      <text x="0" y="28" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#4a5568">• 预留重要时间</text>
      <text x="0" y="41" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#4a5568">• 平衡多重角色</text>
    </g>
  </g>
  
</svg>