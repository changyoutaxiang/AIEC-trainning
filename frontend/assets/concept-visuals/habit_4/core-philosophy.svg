<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient definitions -->
    <linearGradient id="winwinGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:0.9"/>
      <stop offset="50%" style="stop-color:#764ba2;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#f093fb;stop-opacity:0.7"/>
    </linearGradient>
    <linearGradient id="growthGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4facfe;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#00f2fe;stop-opacity:0.8"/>
    </linearGradient>
    <radialGradient id="cakeGradient" cx="50%" cy="30%" r="70%">
      <stop offset="0%" style="stop-color:#ffd700;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#ffb347;stop-opacity:0.8"/>
    </radialGradient>
    <linearGradient id="handGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#feca57;stop-opacity:0.8"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="#f8fafc"/>
  
  <!-- Title -->
  <text x="200" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2d3748">双赢思维核心理念</text>
  <text x="200" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#4a5568">"从我到我们的视角转换"</text>
  
  <!-- Central growing cake metaphor -->
  <g transform="translate(200, 140)">
    <!-- Expandable pie/cake -->
    <circle cx="0" cy="0" r="50" fill="url(#cakeGradient)" stroke="#d4a574" stroke-width="2"/>
    
    <!-- Growth arrows pointing outward -->
    <g transform="rotate(0)">
      <path d="M35,0 L55,0 M50,-5 L55,0 L50,5" stroke="#4facfe" stroke-width="2" fill="none"/>
    </g>
    <g transform="rotate(90)">
      <path d="M35,0 L55,0 M50,-5 L55,0 L50,5" stroke="#4facfe" stroke-width="2" fill="none"/>
    </g>
    <g transform="rotate(180)">
      <path d="M35,0 L55,0 M50,-5 L55,0 L50,5" stroke="#4facfe" stroke-width="2" fill="none"/>
    </g>
    <g transform="rotate(270)">
      <path d="M35,0 L55,0 M50,-5 L55,0 L50,5" stroke="#4facfe" stroke-width="2" fill="none"/>
    </g>
    
    <!-- Center text -->
    <text x="0" y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2d3748" font-weight="bold">共同</text>
    <text x="0" y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2d3748" font-weight="bold">做大</text>
    <text x="0" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#4a5568">蛋糕</text>
    
    <!-- Surrounding expansion rings -->
    <circle cx="0" cy="0" r="65" fill="none" stroke="#4facfe" stroke-width="1" stroke-dasharray="3,3" opacity="0.6"/>
    <circle cx="0" cy="0" r="80" fill="none" stroke="#4facfe" stroke-width="1" stroke-dasharray="5,5" opacity="0.4"/>
  </g>
  
  <!-- Two hands reaching toward each other (cooperation symbol) -->
  <g transform="translate(80, 90)">
    <!-- Left hand -->
    <path d="M0,20 Q5,15 10,10 Q15,5 25,0 Q30,5 25,10 Q20,15 15,25 Q10,30 0,20" 
          fill="url(#handGradient)" stroke="#e67e22" stroke-width="1"/>
    <text x="12" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#2d3748">我</text>
  </g>
  
  <g transform="translate(320, 90) scale(-1, 1)">
    <!-- Right hand (mirrored) -->
    <path d="M0,20 Q5,15 10,10 Q15,5 25,0 Q30,5 25,10 Q20,15 15,25 Q10,30 0,20" 
          fill="url(#handGradient)" stroke="#e67e22" stroke-width="1"/>
  </g>
  <text x="320" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#2d3748">你</text>
  
  <!-- Win-Win formula -->
  <g transform="translate(50, 200)">
    <!-- My Win -->
    <rect x="0" y="0" width="60" height="30" fill="#4facfe" rx="4" opacity="0.8"/>
    <text x="30" y="12" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#ffffff" font-weight="bold">我的赢</text>
    <text x="30" y="24" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#ffffff">利益实现</text>
    
    <!-- Plus sign -->
    <text x="80" y="20" font-family="Arial, sans-serif" font-size="16" fill="#2d3748" font-weight="bold">+</text>
    
    <!-- Your Win -->
    <rect x="100" y="0" width="60" height="30" fill="#f093fb" rx="4" opacity="0.8"/>
    <text x="130" y="12" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#ffffff" font-weight="bold">你的赢</text>
    <text x="130" y="24" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#ffffff">需求满足</text>
    
    <!-- Equals -->
    <text x="180" y="20" font-family="Arial, sans-serif" font-size="16" fill="#2d3748" font-weight="bold">=</text>
    
    <!-- Bigger Win -->
    <rect x="200" y="0" width="80" height="30" fill="url(#growthGradient)" rx="4"/>
    <text x="240" y="12" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2d3748" font-weight="bold">更大的赢</text>
    <text x="240" y="24" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#2d3748">1+1>2</text>
  </g>
  
  <!-- Key mindset shift illustration -->
  <g transform="translate(60, 250)">
    <!-- Scarcity vs Abundance -->
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="11" fill="#2d3748" font-weight="bold">心态转变：</text>
    
    <!-- Scarcity mindset -->
    <rect x="80" y="-15" width="70" height="20" fill="#ff6b6b" rx="3" opacity="0.3"/>
    <text x="115" y="-8" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#2d3748">❌ 匮乏心态</text>
    <text x="115" y="2" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#2d3748">固定蛋糕</text>
    
    <!-- Arrow -->
    <path d="M155,0 L175,0 M170,-3 L175,0 L170,3" stroke="#2d3748" stroke-width="1" fill="none"/>
    
    <!-- Abundance mindset -->
    <rect x="185" y="-15" width="70" height="20" fill="#4facfe" rx="3" opacity="0.3"/>
    <text x="220" y="-8" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#2d3748">✅ 富足心态</text>
    <text x="220" y="2" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#2d3748">共同做大</text>
  </g>
  
  <!-- Bottom core concept -->
  <text x="200" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#4a5568" font-style="italic">"蛋糕不是固定的，我们可以一起做大"</text>
</svg>