<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient definitions -->
    <linearGradient id="empathyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:0.9"/>
      <stop offset="50%" style="stop-color:#764ba2;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#f093fb;stop-opacity:0.7"/>
    </linearGradient>
    <linearGradient id="perspectiveGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4facfe;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#00f2fe;stop-opacity:0.8"/>
    </linearGradient>
    <radialGradient id="glassGradient" cx="50%" cy="30%" r="70%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.9"/>
      <stop offset="70%" style="stop-color:#4facfe;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#667eea;stop-opacity:0.1"/>
    </radialGradient>
    <linearGradient id="seatGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffecd2;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#fcb69f;stop-opacity:0.8"/>
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="#f8fafc"/>
  
  <!-- Title -->
  <text x="200" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2d3748">识别对方的"赢"</text>
  <text x="200" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#4a5568">"在谈判桌上，坐到对方那一边去"</text>
  
  <!-- Central negotiation table with perspective shift -->
  <g transform="translate(200, 120)">
    <!-- Negotiation table (oval perspective) -->
    <ellipse cx="0" cy="20" rx="80" ry="25" fill="#8b4513" opacity="0.7"/>
    <ellipse cx="0" cy="15" rx="80" ry="25" fill="#d2b48c" opacity="0.8"/>
    
    <!-- Chair on "my" side -->
    <g transform="translate(-60, -10)">
      <rect x="-12" y="0" width="24" height="30" fill="url(#seatGradient)" rx="3"/>
      <rect x="-10" y="-8" width="20" height="8" fill="url(#seatGradient)" rx="2"/>
      <text x="0" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#2d3748" font-weight="bold">我的位置</text>
    </g>
    
    <!-- Chair on "their" side -->
    <g transform="translate(60, -10)">
      <rect x="-12" y="0" width="24" height="30" fill="url(#seatGradient)" rx="3"/>
      <rect x="-10" y="-8" width="20" height="8" fill="url(#seatGradient)" rx="2"/>
      <text x="0" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#2d3748" font-weight="bold">对方位置</text>
    </g>
    
    <!-- Empathy lens/glasses floating above -->
    <g transform="translate(0, -40)">
      <!-- Lens frames -->
      <circle cx="-15" cy="0" r="12" fill="url(#glassGradient)" stroke="#4facfe" stroke-width="2"/>
      <circle cx="15" cy="0" r="12" fill="url(#glassGradient)" stroke="#4facfe" stroke-width="2"/>
      <!-- Bridge -->
      <rect x="-3" y="-2" width="6" height="4" fill="#4facfe" rx="2"/>
      <!-- Side arms -->
      <line x1="-27" y1="-3" x2="-35" y2="-8" stroke="#4facfe" stroke-width="2"/>
      <line x1="27" y1="-3" x2="35" y2="-8" stroke="#4facfe" stroke-width="2"/>
      
      <text x="0" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#4facfe" font-weight="bold">换位思考镜</text>
    </g>
    
    <!-- Arrow indicating perspective shift -->
    <path d="M-40,0 Q0,-30 40,0" stroke="#667eea" stroke-width="3" fill="none" marker-end="url(#perspectiveArrow)" stroke-dasharray="5,5"/>
    <text x="0" y="-15" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#667eea" font-weight="bold">视角转换</text>
  </g>
  
  <!-- Their perspective view -->
  <g transform="translate(320, 180)">
    <!-- Thought bubble showing "their win" -->
    <ellipse cx="0" cy="0" rx="35" ry="25" fill="url(#perspectiveGradient)" stroke="#4facfe" stroke-width="2"/>
    
    <!-- Their core interests/needs -->
    <text x="0" y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#2d3748" font-weight="bold">他们的"赢"</text>
    <text x="0" y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#2d3748">✓ KPI达成</text>
    <text x="0" y="8" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#2d3748">✓ 风险控制</text>
    <text x="0" y="16" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#2d3748">✓ 团队认可</text>
    
    <text x="0" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#4a5568">深层需求分析</text>
  </g>
  
  <!-- Exploration process -->
  <g transform="translate(50, 180)">
    <!-- Question marks floating around -->
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="20" fill="#667eea" font-weight="bold">?</text>
    <text x="20" y="-10" font-family="Arial, sans-serif" font-size="16" fill="#764ba2" font-weight="bold">?</text>
    <text x="10" y="20" font-family="Arial, sans-serif" font-size="18" fill="#f093fb" font-weight="bold">?</text>
    
    <!-- Questions list -->
    <text x="40" y="-5" font-family="Arial, sans-serif" font-size="9" fill="#2d3748" font-weight="bold">探寻关键问题：</text>
    <text x="40" y="8" font-family="Arial, sans-serif" font-size="8" fill="#4a5568">• 你最担心的是什么？</text>
    <text x="40" y="18" font-family="Arial, sans-serif" font-size="8" fill="#4a5568">• 什么对你最重要？</text>
    <text x="40" y="28" font-family="Arial, sans-serif" font-size="8" fill="#4a5568">• 如何衡量成功？</text>
  </g>
  
  <!-- Arrow markers -->
  <defs>
    <marker id="perspectiveArrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#667eea"/>
    </marker>
  </defs>
  
  <!-- Bottom framework -->
  <g transform="translate(50, 230)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="11" fill="#2d3748" font-weight="bold">识别"赢"的三层分析：</text>
    
    <!-- Layer 1: Surface position -->
    <rect x="0" y="10" width="80" height="15" fill="#ff6b6b" rx="2" opacity="0.3"/>
    <text x="5" y="20" font-family="Arial, sans-serif" font-size="8" fill="#2d3748" font-weight="bold">表面立场</text>
    <text x="85" y="20" font-family="Arial, sans-serif" font-size="8" fill="#4a5568">"我要这个功能"</text>
    
    <!-- Arrow down -->
    <path d="M40,30 L40,40 M37,37 L40,40 L43,37" stroke="#4a5568" stroke-width="1" fill="none"/>
    
    <!-- Layer 2: Underlying interest -->
    <rect x="0" y="45" width="80" height="15" fill="#ffa726" rx="2" opacity="0.3"/>
    <text x="5" y="55" font-family="Arial, sans-serif" font-size="8" fill="#2d3748" font-weight="bold">核心利益</text>
    <text x="85" y="55" font-family="Arial, sans-serif" font-size="8" fill="#4a5568">"解决X痛点"</text>
    
    <!-- Arrow down -->
    <path d="M40,65 L40,75 M37,72 L40,75 L43,72" stroke="#4a5568" stroke-width="1" fill="none"/>
    
    <!-- Layer 3: Deep needs -->
    <rect x="0" y="80" width="80" height="15" fill="#4facfe" rx="2" opacity="0.3"/>
    <text x="5" y="90" font-family="Arial, sans-serif" font-size="8" fill="#2d3748" font-weight="bold">深层需求</text>
    <text x="85" y="90" font-family="Arial, sans-serif" font-size="8" fill="#4a5568">"获得认可"</text>
    
    <!-- Result -->
    <g transform="translate(200, 45)">
      <rect x="0" y="0" width="120" height="30" fill="url(#empathyGradient)" rx="4"/>
      <text x="60" y="12" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#ffffff" font-weight="bold">找到真正的"赢"</text>
      <text x="60" y="24" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#ffffff">设计共同解决方案</text>
    </g>
  </g>
</svg>