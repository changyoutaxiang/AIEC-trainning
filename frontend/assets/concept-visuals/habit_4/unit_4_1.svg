<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient definitions -->
    <linearGradient id="abundanceGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe;stop-opacity:0.9"/>
      <stop offset="50%" style="stop-color:#00f2fe;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#667eea;stop-opacity:0.9"/>
    </linearGradient>
    <linearGradient id="scarcityGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#ff4757;stop-opacity:1"/>
    </linearGradient>
    <radialGradient id="appleTreeGradient" cx="50%" cy="30%" r="70%">
      <stop offset="0%" style="stop-color:#27ae60;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#2ecc71;stop-opacity:0.7"/>
    </radialGradient>
    <linearGradient id="appleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#ff8e53;stop-opacity:0.8"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="#f8fafc"/>
  
  <!-- Title -->
  <text x="200" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2d3748">培养富足心态</text>
  <text x="200" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#4a5568">"蛋糕不是固定的，我们可以一起做大"</text>
  
  <!-- Central comparison: Apple fight vs Apple tree -->
  <!-- Left side: Scarcity mindset (fighting over one apple) -->
  <g transform="translate(90, 110)">
    <!-- Two figures fighting over apple -->
    <rect x="-40" y="-20" width="80" height="80" fill="url(#scarcityGradient)" rx="8" opacity="0.2"/>
    
    <!-- Single apple in the center -->
    <circle cx="0" cy="10" r="12" fill="url(#appleGradient)" stroke="#c53030" stroke-width="1"/>
    <path d="M0,-2 Q-2,-8 0,-12 Q2,-8 0,-2" fill="#27ae60"/>
    <text x="0" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#ffffff" font-weight="bold">🍎</text>
    
    <!-- Two hands reaching for apple -->
    <g transform="translate(-20, 5)">
      <path d="M0,0 Q5,5 15,10 Q10,15 5,10 Q0,5 -5,0" fill="#ff6b6b" opacity="0.8"/>
      <text x="-10" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#2d3748">我要</text>
    </g>
    
    <g transform="translate(20, 5)">
      <path d="M0,0 Q-5,5 -15,10 Q-10,15 -5,10 Q0,5 5,0" fill="#ff6b6b" opacity="0.8"/>
      <text x="10" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#2d3748">我抢</text>
    </g>
    
    <!-- Label -->
    <text x="0" y="-30" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#c53030" font-weight="bold">❌ 匮乏心态</text>
    <text x="0" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#4a5568">争夺有限资源</text>
  </g>
  
  <!-- Arrow pointing from scarcity to abundance -->
  <g transform="translate(200, 125)">
    <path d="M-30,0 L30,0 M25,-5 L30,0 L25,5" stroke="#4facfe" stroke-width="3" fill="none"/>
    <text x="0" y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#4facfe" font-weight="bold">转变</text>
  </g>
  
  <!-- Right side: Abundance mindset (planting apple tree) -->
  <g transform="translate(310, 110)">
    <!-- Apple tree with multiple fruits -->
    <rect x="-40" y="-20" width="80" height="80" fill="url(#abundanceGradient)" rx="8" opacity="0.2"/>
    
    <!-- Tree trunk -->
    <rect x="-3" y="20" width="6" height="25" fill="#8b4513"/>
    
    <!-- Tree crown -->
    <circle cx="0" cy="0" r="25" fill="url(#appleTreeGradient)" opacity="0.8"/>
    
    <!-- Multiple apples on tree -->
    <circle cx="-15" cy="-10" r="4" fill="url(#appleGradient)"/>
    <text x="-15" y="-7" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="#ffffff">🍎</text>
    
    <circle cx="10" cy="-15" r="4" fill="url(#appleGradient)"/>
    <text x="10" y="-12" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="#ffffff">🍎</text>
    
    <circle cx="5" cy="5" r="4" fill="url(#appleGradient)"/>
    <text x="5" y="8" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="#ffffff">🍎</text>
    
    <circle cx="-10" cy="8" r="4" fill="url(#appleGradient)"/>
    <text x="-10" y="11" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="#ffffff">🍎</text>
    
    <circle cx="18" cy="2" r="4" fill="url(#appleGradient)"/>
    <text x="18" y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="#ffffff">🍎</text>
    
    <!-- Two hands working together (watering/caring) -->
    <g transform="translate(-15, 35)">
      <path d="M0,0 Q3,2 8,5 Q5,8 2,5 Q0,3 -2,0" fill="#4facfe" opacity="0.8"/>
      <text x="-8" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#2d3748">共同</text>
    </g>
    
    <g transform="translate(15, 35)">
      <path d="M0,0 Q-3,2 -8,5 Q-5,8 -2,5 Q0,3 2,0" fill="#4facfe" opacity="0.8"/>
      <text x="8" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#2d3748">培养</text>
    </g>
    
    <!-- Label -->
    <text x="0" y="-35" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#27ae60" font-weight="bold">✅ 富足心态</text>
    <text x="0" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#4a5568">创造共同价值</text>
  </g>
  
  <!-- Key insights at bottom -->
  <g transform="translate(50, 220)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="11" fill="#2d3748" font-weight="bold">富足心态的三个标志：</text>
    
    <!-- Insight 1 -->
    <circle cx="0" cy="20" r="8" fill="#4facfe"/>
    <text x="0" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#ffffff" font-weight="bold">1</text>
    <text x="15" y="25" font-family="Arial, sans-serif" font-size="9" fill="#4a5568">看到他人成功时，我会思考：我能从中学到什么？</text>
    
    <!-- Insight 2 -->
    <circle cx="0" cy="40" r="8" fill="#667eea"/>
    <text x="0" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#ffffff" font-weight="bold">2</text>
    <text x="15" y="45" font-family="Arial, sans-serif" font-size="9" fill="#4a5568">面对资源冲突时，我会问：如何让资源池变得更大？</text>
    
    <!-- Insight 3 -->
    <circle cx="0" cy="60" r="8" fill="#f093fb"/>
    <text x="0" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#ffffff" font-weight="bold">3</text>
    <text x="15" y="65" font-family="Arial, sans-serif" font-size="9" fill="#4a5568">主动分享荣誉与机会，因为成功会带来更多成功</text>
  </g>
  
  <!-- Growth arrows around tree -->
  <g transform="translate(310, 85)">
    <path d="M-35,0 Q-40,-5 -35,-10" stroke="#27ae60" stroke-width="2" fill="none" marker-end="url(#growthArrow)"/>
    <path d="M35,0 Q40,-5 35,-10" stroke="#27ae60" stroke-width="2" fill="none" marker-end="url(#growthArrow)"/>
    <path d="M0,-35 Q-5,-40 -10,-35" stroke="#27ae60" stroke-width="2" fill="none" marker-end="url(#growthArrow)"/>
    <path d="M0,-35 Q5,-40 10,-35" stroke="#27ae60" stroke-width="2" fill="none" marker-end="url(#growthArrow)"/>
  </g>
  
  <!-- Arrow marker -->
  <defs>
    <marker id="growthArrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#27ae60"/>
    </marker>
  </defs>
</svg>