<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>习惯学习 - AIEC 职场软技能</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <nav class="nav">
                <div class="logo">AIEC 职场软技能</div>
                <div class="nav-links">
                    <a href="index.html">首页</a>
                    <a href="seven-habits.html">七个习惯</a>
                    <a href="skills.html">技能训练</a>
                    <a href="#" onclick="logout()">退出</a>
                </div>
            </nav>
        </header>

        <div class="learning-container">
            <div class="learning-header">
                <div class="habit-badge">
                    <span class="habit-number" id="habitNumber">1</span>
                </div>
                <h1 id="habitTitle">积极主动</h1>
                <p id="habitSubtitle">掌握主动权，对自己的行为和选择负责</p>
                <div class="progress-section">
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill" style="width: 0%"></div>
                    </div>
                    <span class="progress-text" id="progressText">0% 完成</span>
                </div>
            </div>

            <div class="learning-content">
                <div class="learning-modules">
                    <div class="module-card active" data-module="concept">
                        <div class="module-icon">💡</div>
                        <h3>理念导入</h3>
                        <p>深入理解核心概念</p>
                    </div>
                    <div class="module-card" data-module="mentor">
                        <div class="module-icon">🎯</div>
                        <h3>导师采撷</h3>
                        <p>Leon导师的经验分享</p>
                    </div>
                    <div class="module-card" data-module="practice">
                        <div class="module-icon">🔥</div>
                        <h3>实战模拟</h3>
                        <p>在真实场景中练习</p>
                    </div>
                </div>

                <div class="content-area">
                    <div class="content-section" id="conceptContent">
                        <h2>理念导入</h2>
                        <div class="content-text" id="conceptText">
                            <!-- 具体内容将通过JavaScript动态加载 -->
                        </div>
                        <div class="content-actions">
                            <button class="btn btn-primary" onclick="nextModule()">继续学习</button>
                        </div>
                    </div>

                    <div class="content-section hidden" id="mentorContent">
                        <h2>导师采撷</h2>
                        <div class="content-text" id="mentorText">
                            <!-- 具体内容将通过JavaScript动态加载 -->
                        </div>
                        <div class="content-actions">
                            <button class="btn btn-secondary" onclick="prevModule()">上一步</button>
                            <button class="btn btn-primary" onclick="nextModule()">继续学习</button>
                        </div>
                    </div>

                    <div class="content-section hidden" id="practiceContent">
                        <h2>实战模拟</h2>
                        <div class="practice-arena" id="practiceArena">
                            <!-- 实战模拟界面 -->
                            <div class="practice-selector" id="practiceSelector">
                                <h3>选择练习场景</h3>
                                <div class="practice-list" id="practiceList">
                                    <!-- 动态加载练习列表 -->
                                </div>
                            </div>
                            
                            <div class="practice-workspace hidden" id="practiceWorkspace">
                                <!-- 当前练习工作区 -->
                                <div class="practice-header">
                                    <h3 id="practiceTitle"></h3>
                                    <button class="btn-secondary btn-small" onclick="backToPracticeList()">返回列表</button>
                                </div>
                                
                                <div class="practice-scenario">
                                    <h4>场景描述</h4>
                                    <div class="scenario-content" id="scenarioContent"></div>
                                </div>
                                
                                <div class="practice-task">
                                    <h4>任务要求</h4>
                                    <div class="task-content" id="taskContent"></div>
                                </div>
                                
                                <div class="practice-input">
                                    <h4>你的回复</h4>
                                    <textarea id="userResponse" placeholder="请输入你的回复..."></textarea>
                                    <div class="input-actions">
                                        <button class="btn-primary" onclick="submitPracticeResponse()">提交回复</button>
                                        <button class="btn-secondary" onclick="clearResponse()">清空</button>
                                    </div>
                                </div>
                                
                                <div class="practice-evaluation hidden" id="practiceEvaluation">
                                    <h4>AI 导师评估</h4>
                                    <div class="evaluation-content">
                                        <div class="overall-score">
                                            <span class="score-label">综合得分</span>
                                            <span class="score-value" id="overallScore">--</span>
                                        </div>
                                        
                                        <div class="dimension-scores" id="dimensionScores">
                                            <!-- 各维度得分 -->
                                        </div>
                                        
                                        <div class="evaluation-feedback">
                                            <h5>详细反馈</h5>
                                            <div class="feedback-content" id="feedbackContent"></div>
                                        </div>
                                        
                                        <div class="evaluation-highlights">
                                            <h5>亮点表现</h5>
                                            <ul class="highlights-list" id="highlightsList"></ul>
                                        </div>
                                        
                                        <div class="evaluation-improvements">
                                            <h5>改进建议</h5>
                                            <ul class="improvements-list" id="improvementsList"></ul>
                                        </div>
                                        
                                        <div class="evaluation-actions">
                                            <button class="btn-primary" onclick="retryPractice()">重新练习</button>
                                            <button class="btn-secondary" onclick="nextPractice()">下一个练习</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="content-actions">
                            <button class="btn btn-secondary" onclick="prevModule()">上一步</button>
                            <button class="btn btn-primary" onclick="completeHabit()">完成学习</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script src="js/habit-learning.js"></script>
</body>
</html>
